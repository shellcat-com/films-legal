<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You're invited · Filmsera</title>
<link rel="canonical" href="https://getfilmsera.cam/join/" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-itunes-app" content="app-id=6781880091, app-argument=https://getfilmsera.cam/join/" id="smartBanner" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="You're invited · Filmsera" />
<meta name="twitter:description" content="Open this invitation to join a shared Film and add your photos." />
<meta name="twitter:image" content="https://getfilmsera.cam/shots/panel-1.png" />
<meta name="description" content="You've been invited to a shared Film on Filmsera." />
<meta property="og:title" content="You're invited · Filmsera" />
<meta property="og:description" content="Open this invitation to join a shared Film and add your photos." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://getfilmsera.cam/shots/panel-1.png" />
<meta name="theme-color" content="#0A0807" />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Hanken+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0A0807; --surface:#1C1813; --brass:#E6B450; --brass-deep:#1A1206;
    --cream:#F4ECDD; --muted:#A89C88; --hair:rgba(245,232,210,.10);
    --display:"Fraunces",Georgia,serif;
    --body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--body);color:var(--cream);min-height:100svh;text-align:center;padding:28px;
    background:radial-gradient(120% 70% at 50% -10%, #18130D 0%, #0A0807 48%, #060504 100%) fixed;}
  .wrap{max-width:460px;min-height:calc(100svh - 56px);margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .spark{width:26px;height:26px;display:inline-block;vertical-align:-.18em;margin-right:8px;}
  .brandrow{font-family:var(--display);font-size:30px;letter-spacing:.3px;margin-bottom:30px;}
  .eyebrow{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--brass);}
  .cover{display:block;width:150px;height:188px;object-fit:cover;border:8px solid #fff;border-radius:6px;
    box-shadow:0 14px 30px rgba(0,0,0,.45);transform:rotate(-2.5deg);margin:0 auto 26px;background:var(--surface);}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,46px);line-height:1.05;margin-top:10px;letter-spacing:-.5px;}
  p.lead{color:var(--muted);font-size:17px;margin-top:14px;max-width:420px;}
  .meta{color:var(--muted);font-size:14px;margin-top:9px;}
  .presence{display:inline-flex;margin-top:18px;padding:9px 16px;border:1px solid var(--hair);border-radius:999px;background:rgba(255,255,255,.04);font-weight:600;font-size:13px;}
  .codecard{margin:30px auto 0;max-width:380px;width:100%;background:var(--surface);
    border:1px solid var(--hair);border-radius:22px;padding:26px 22px;}
  .codelabel{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:3px;color:var(--muted);}
  .code{font-family:var(--mono);font-weight:700;font-size:clamp(38px,11vw,52px);letter-spacing:10px;
    color:var(--brass);margin:10px 0 4px;}
  .hint{color:var(--muted);font-size:14px;line-height:1.5;margin-top:8px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:26px;
    font-weight:700;font-size:16px;border:0;cursor:pointer;border-radius:999px;padding:15px 30px;
    color:var(--brass-deep);background:var(--brass);box-shadow:0 14px 32px rgba(230,180,80,.24);text-decoration:none;}
  .btn:active{transform:translateY(1px);}
  .copy{margin-top:14px;background:transparent;border:1px solid var(--hair);color:var(--cream);
    border-radius:999px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--body);}
  .copied{color:var(--brass);}
  .state{font-family:var(--display);font-style:italic;color:var(--muted);font-size:22px;}
  .foot{margin-top:30px;color:var(--muted);font-size:14px;}
  .foot a{color:var(--brass);text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandrow"><svg class="spark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 2 C53 30 70 47 98 50 C70 53 53 70 50 98 C47 70 30 53 2 50 C30 47 47 30 50 2 Z" fill="#E6B450"/></svg>Filmsera</div>
  <main id="content"><div class="state">Opening your invitation…</div></main>
</div>

<script>
  const CONVEX = "https://elated-gopher-868.convex.cloud";
  const APP_STORE = "https://apps.apple.com/us/app/filmsera-group-film-camera/id6781880091";

  // Accept both the canonical /join/XXXX route and previously shared query links.
  function readCode() {
    const p = new URLSearchParams(location.search);
    const m = location.pathname.match(/^\/join\/([A-Za-z0-9]{4,16})\/?$/);
    return (p.get("code") || (m && m[1]) || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 16);
  }
  const code = readCode();
  const content = document.getElementById("content");
  const banner = document.getElementById("smartBanner");
  if (banner) banner.content = `app-id=6781880091, app-argument=${location.href}`;
  const esc = value => String(value ?? "").replace(/[&<>\"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

  function render(film) {
    if (!film) {
      content.innerHTML = `<div class="state">We couldn't find this Film.<br>Check the invite code and try again.</div><a class="btn" href="${APP_STORE}">Get Filmsera</a>`;
      return;
    }
    const members = Math.round(film.memberCount || 0);
    const shots = Math.round(film.shotCount || 0);
    const date = film.eventDate ? new Date(film.eventDate).toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"}) : "";
    content.innerHTML = `
      ${film.coverUrl ? `<img class="cover" src="${esc(film.coverUrl)}" alt="${esc(film.title)} cover">` : ""}
      <span class="eyebrow">You're invited</span>
      <h1>${esc(film.title)}</h1>
      ${film.hostName ? `<p class="lead">Hosted by <strong style="color:var(--cream)">${esc(film.hostName)}</strong></p>` : ""}
      ${date ? `<div class="meta">${esc(date)}</div>` : ""}
      <div class="presence">${members} ${members === 1 ? "person" : "people"} · ${shots} ${shots === 1 ? "shot" : "shots"}</div>
      <div class="codecard"><div class="codelabel">SHARE CODE</div><div class="code">${esc(code)}</div>
        <div class="hint">Open Filmsera to join this Film and start shooting.</div>
        <a class="btn" id="openBtn" href="filmcamera://join/${encodeURIComponent(code)}">Open in Filmsera</a><br>
        <button class="copy" id="copyBtn" type="button">Copy code</button></div>
      <div class="foot">Don't have Filmsera yet? <a href="${APP_STORE}">Download on the App Store →</a></div>`;
    const copy = document.getElementById("copyBtn");
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(code); copy.textContent = "Copied ✓"; copy.classList.add("copied"); }
      catch { copy.textContent = code; }
    });
    const open = document.getElementById("openBtn");
    open.addEventListener("click", () => {
      const fallback = setTimeout(() => { location.href = APP_STORE; }, 1600);
      window.addEventListener("pagehide", () => clearTimeout(fallback), {once:true});
      document.addEventListener("visibilitychange", () => { if (document.hidden) clearTimeout(fallback); }, {once:true});
    });
  }

  async function load() {
    if (!code) { render(null); return; }
    try {
      const response = await fetch(`${CONVEX}/api/query`, {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({path:"films:getByInviteCode", args:{inviteCode:code}, format:"json"})
      });
      const result = await response.json();
      render(result && result.status === "success" ? result.value : null);
    } catch (_) {
      content.innerHTML = `<div class="state">Couldn't open your invitation.<br>Check your connection and try again.</div><a class="btn" href="${APP_STORE}">Get Filmsera</a>`;
    }
  }
  load();
</script>
</body>
</html>
