     og:/twitter: tags with the film's own title, host and share card, and
     injects a JSON <script id="invite-data"> so the page paints without a round trip. Without
     the Worker the page still works: it looks the code up itself. -->

     script below by hash: after editing that script, run `node scripts/csp-hash.mjs`.
     The invite Worker passes data in a non-executable application/json block. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-Jp0RG/gNMMZwU40uZLKg0F2054epRguzxaHyCCygScU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://elated-gopher-868.convex.site https://elated-gopher-868.convex.cloud https://resilient-goat-339.convex.site https://resilient-goat-339.convex.cloud https://media.getfilmsera.cam; base-uri 'none'; form-action 'self'; object-src 'none'" />

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0A0807; --surface:#16120E; --surface-2:#1E1913; --brass:#E6B450; --brass-hi:#F2CB74; --brass-deep:#1A1206;
    --cream:#F4ECDD; --muted:#A89C88; --dim:#6F6556; --hair:rgba(245,232,210,.10); --hair-2:rgba(245,232,210,.16);
    --display:"Instrument Serif",Georgia,serif;
    --body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"Space Mono",ui-monospace,Menlo,monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--bg);-webkit-text-size-adjust:100%;}
  body{font-family:var(--body);color:var(--cream);min-height:100svh;background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  a{color:inherit;}

  /* Film grain over everything — the one texture the app uses too. */
  .grain{position:fixed;inset:-50%;pointer-events:none;z-index:50;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain 1.2s steps(4) infinite;}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(0,0)}}

  .mark{width:26px;height:19px;display:inline-block;flex:none;background:var(--brass);
    -webkit-mask:url(/brand/filmsera-mark.svg) center/contain no-repeat;mask:url(/brand/filmsera-mark.svg) center/contain no-repeat;}
  .wordmark{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);font-size:24px;letter-spacing:.2px;text-decoration:none;color:var(--cream);}
  .eyebrow{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;color:var(--muted);}

  /* ---------- The invitation (the same card on phone and inside the desktop mock-up) ---------- */
  .invite{position:relative;display:flex;flex-direction:column;min-height:100svh;background:var(--bg);overflow:hidden;isolation:isolate;}
  .cover{position:absolute;inset:0 0 auto 0;height:64%;z-index:-1;overflow:hidden;background:#120E0A;}
  .cover img{width:100%;height:100%;object-fit:cover;transform-origin:50% 40%;opacity:0;
    transition:opacity 1.1s var(--ease);animation:kenburns 22s ease-in-out infinite alternate;}
  .cover img.loaded{opacity:1;}
  @keyframes kenburns{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
  .cover::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,8,7,.55) 0%,rgba(10,8,7,0) 22%,rgba(10,8,7,.08) 50%,rgba(10,8,7,.82) 82%,var(--bg) 100%);}
  .cover.empty{background:radial-gradient(90% 70% at 70% 15%,rgba(230,180,80,.28),transparent 60%),radial-gradient(70% 60% at 10% 60%,rgba(190,90,50,.22),transparent 65%),#120E0A;}
  /* Light leak, slow and faint. */
  .leak{position:absolute;inset:0;z-index:-1;pointer-events:none;mix-blend-mode:screen;opacity:.55;
    background:radial-gradient(40% 30% at 100% 8%,rgba(255,140,60,.35),transparent 70%);animation:leak 9s ease-in-out infinite alternate;}
  @keyframes leak{from{opacity:.25}to{opacity:.6}}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 22px 0;}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
    background:rgba(10,8,7,.45);border:1px solid var(--hair-2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--cream);}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--brass);box-shadow:0 0 10px var(--brass);animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.35}}

  .sheet{margin-top:auto;padding:0 24px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;}
  .sheet{text-shadow:0 1px 18px rgba(0,0,0,.45);}
  .host{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:500;color:var(--cream);opacity:.92;}
  .avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700;color:var(--brass-deep);
    background:linear-gradient(135deg,var(--brass-hi),var(--brass));box-shadow:0 0 0 2px rgba(10,8,7,.6);}
  h1.title{font-family:var(--display);font-weight:400;font-size:clamp(46px,13vw,64px);line-height:.98;letter-spacing:-.6px;margin-top:10px;text-wrap:balance;}
  .meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:12px;letter-spacing:.2px;}
  .meta b{color:var(--cream);font-weight:400;}

  /* Develop countdown — mono digits in little frames, like a dial readout. */
  .develop{margin-top:20px;display:grid;gap:10px;padding:13px 14px 14px;border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid var(--hair);}
  .develop .label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;white-space:nowrap;font-family:var(--mono);font-size:10px;letter-spacing:2.2px;color:var(--muted);text-transform:uppercase;}
  .develop .label strong{color:var(--cream);font-family:var(--body);font-size:13px;letter-spacing:0;text-transform:none;font-weight:600;}
  .clock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .unit{text-align:center;padding:8px 0 6px;border-radius:11px;background:#0E0B08;border:1px solid var(--hair);}
  .unit b{display:block;font-family:var(--mono);font-size:21px;font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums;line-height:1.1;}
  .unit i{display:block;font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:1.4px;color:var(--dim);margin-top:2px;}

  .spots{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--muted);}
  .frames{display:flex;gap:4px;}
  .frames span{width:9px;height:13px;border-radius:2px;border:1px solid var(--hair-2);}
  .frames span.on{background:var(--brass);border-color:var(--brass);}

  .cta{margin-top:22px;position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px 24px;border-radius:999px;
    font-family:var(--mono);font-weight:700;font-size:15.5px;letter-spacing:.2px;color:var(--brass-deep);text-decoration:none;overflow:hidden;
    background:linear-gradient(180deg,var(--brass-hi),var(--brass));box-shadow:0 18px 40px -12px rgba(230,180,80,.55),inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .18s var(--ease),box-shadow .18s var(--ease);}
  .cta:active{transform:scale(.98);}
  .cta::after{content:"";position:absolute;inset:0;transform:translateX(-120%);
    background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);animation:sheen 4.5s ease-in-out 1.4s infinite;}
  @keyframes sheen{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
  .cta svg{width:18px;height:18px;}
  .fine{text-align:center;font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5;}

  .code{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 16px;border-radius:16px;border:1px dashed var(--hair-2);}
  .code .k{font-family:var(--mono);font-size:10px;letter-spacing:2.2px;color:var(--muted);}
  .code .v{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:5px;color:var(--cream);margin-top:1px;}
  .copy{padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--hair);font-size:13px;font-weight:600;white-space:nowrap;transition:background .2s;}
  .copy.done{color:var(--brass);}

  /* How it works — three quiet steps under the fold. */
  .how{padding:34px 24px calc(40px + env(safe-area-inset-bottom));border-top:1px solid var(--hair);}
  .how h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:8px 0 18px;}
  .how h2 em{color:var(--brass);}
  .steps{list-style:none;display:grid;gap:10px;}
  .steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--hair);}
  .steps .n{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--brass);background:rgba(230,180,80,.1);border:1px solid rgba(230,180,80,.25);}
  .steps b{display:block;font-weight:600;font-size:15px;}
  .steps p{color:var(--muted);font-size:13.5px;line-height:1.45;margin-top:2px;}
  .footer{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:28px;color:var(--dim);font-size:12px;}
  .footer a{text-decoration:none;color:var(--muted);}
  .badge img{height:44px;display:block;}

  /* Entrance choreography. */
  .rise{opacity:0;transform:translateY(14px);animation:rise .9s var(--ease) forwards;}
  @keyframes rise{to{opacity:1;transform:none}}

  /* ---------- Desktop: invitation in a phone + scan-to-join ---------- */
  .desk{display:none;}
  @media (min-width:900px){
    body{display:grid;place-items:center;padding:48px;
      background:radial-gradient(70% 60% at 30% 40%,rgba(230,180,80,.08),transparent 70%),radial-gradient(60% 60% at 90% 100%,rgba(190,90,50,.07),transparent 70%),var(--bg);}
    .stage{display:grid;grid-template-columns:auto 420px;gap:88px;align-items:center;max-width:1120px;}
    .phone{position:relative;width:372px;height:780px;border-radius:58px;padding:12px;
      background:linear-gradient(145deg,#2a241d,#0d0b09 40%,#1d1914);box-shadow:0 0 0 1px rgba(255,255,255,.07),0 60px 120px -30px rgba(0,0,0,.9),0 30px 80px -40px rgba(230,180,80,.25);}
    .phone::before{content:"";position:absolute;top:24px;left:50%;transform:translateX(-50%);width:110px;height:32px;border-radius:20px;background:#000;z-index:5;}
    .screen{width:100%;height:100%;border-radius:47px;overflow:hidden;position:relative;}
    .screen .invite{min-height:100%;height:100%;}
    .screen .topbar{padding-top:62px;}
    .screen .how{display:none;}
    .screen h1.title{font-size:50px;}
    .screen .unit b{font-size:19px;}
    .desk{display:block;}
    .desk .wordmark{margin-bottom:44px;}
    .desk h2{font-family:var(--display);font-weight:400;font-size:64px;line-height:.98;letter-spacing:-.8px;margin-top:14px;text-wrap:balance;}
    .desk .lead{color:var(--muted);font-size:17px;line-height:1.55;margin-top:16px;max-width:400px;}
    .scan{display:flex;gap:20px;align-items:center;margin-top:34px;padding:18px;border-radius:24px;background:var(--surface);border:1px solid var(--hair);}
    .qr{width:132px;height:132px;flex:none;padding:10px;border-radius:16px;background:#F4ECDD;}
    .qr svg{width:100%;height:100%;display:block;}
    .scan b{display:block;font-size:17px;font-weight:600;}
    .scan p{color:var(--muted);font-size:14px;line-height:1.5;margin-top:6px;}
    .desk .row{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap;}
    .desk .code{margin-top:0;flex:1;min-width:220px;}
  }

  /* ---------- Not found ---------- */
  .lost{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 26px;gap:0;}
  .lost .print{width:132px;height:160px;border-radius:6px;background:#F4ECDD;padding:9px 9px 30px;transform:rotate(-4deg);box-shadow:0 22px 50px rgba(0,0,0,.55);margin-bottom:34px;}
  .lost .print div{width:100%;height:100%;border-radius:2px;background:linear-gradient(160deg,#2a2017,#0d0a07);display:grid;place-items:center;}
  .lost .print .mark{width:40px;height:29px;opacity:.5;}
  .lost h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,10vw,52px);line-height:1;}
  .lost p{color:var(--muted);font-size:16px;line-height:1.5;margin-top:12px;max-width:360px;}
  .lost form{display:flex;gap:8px;margin-top:28px;width:100%;max-width:380px;}
  .lost input{flex:1;min-width:0;padding:16px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--hair-2);color:var(--cream);
    font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:4px;text-transform:uppercase;outline:none;}
  .lost input:focus{border-color:var(--brass);}
  .lost input::placeholder{color:var(--dim);letter-spacing:2px;font-weight:400;}
  .lost form .cta{margin:0;width:auto;padding:16px 22px;}
  .lost .alt{margin-top:22px;font-size:14px;color:var(--muted);}
  .lost .alt a{color:var(--brass);text-decoration:none;}
  .loading{min-height:100svh;display:grid;place-items:center;}
  .loading .mark{width:44px;height:32px;animation:pulse 1.4s ease-in-out infinite;}


  /* ---------- Web join: name sheet, disposable camera, album ---------- */
  .alts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .btn2{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 14px;border-radius:999px;text-decoration:none;text-align:center;
    font-size:13.5px;font-weight:600;color:var(--cream);background:rgba(10,8,7,.5);border:1px solid var(--hair-2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
  .btn2:active{transform:scale(.98);}
  .modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,4,3,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s var(--ease);}
  @keyframes fade{from{opacity:0}}
  .panel{width:100%;max-width:480px;padding:26px 22px calc(24px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--surface);border:1px solid var(--hair-2);border-bottom:0;
    animation:up .35s var(--ease);}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
  @media (min-width:900px){.modal{align-items:center}.panel{border-radius:28px;border-bottom:1px solid var(--hair-2);}}
  .panel h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.02;margin-top:8px;}
  .panel p.sub{color:var(--muted);font-size:14.5px;line-height:1.45;margin-top:8px;}
  .field{width:100%;margin-top:18px;padding:16px 18px;border-radius:16px;background:#0E0B08;border:1px solid var(--hair-2);color:var(--cream);font:500 17px var(--body);outline:none;}
  .field:focus{border-color:var(--brass);}
  .err{min-height:20px;margin-top:10px;font-size:13.5px;color:#F08A6A;}
  .panel .cta{margin-top:6px;}
  .panel .cta[disabled]{opacity:.6;}
  .panel .fine a{color:var(--cream);}
  .linkbtn{display:block;margin:14px auto 0;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;}

  .guest{width:100%;max-width:520px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));}
  @media (min-width:900px){.guest{min-height:auto;padding-top:0;}}
  .g-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .g-top .chip{max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .g-title{font-family:var(--display);font-weight:400;font-size:clamp(32px,9vw,42px);line-height:1;margin-top:18px;text-wrap:balance;}
  .g-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:12px;}
  .count{display:flex;align-items:baseline;gap:8px;}
  .count b{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums;line-height:1;transition:transform .3s var(--ease);}
  .count b.tick{transform:translateY(-4px);}
  .count span{font-family:var(--mono);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);}
  .g-row .frames{flex-wrap:wrap;justify-content:flex-end;max-width:60%;}
  .vf{position:relative;margin-top:14px;border-radius:24px;overflow:hidden;background:#050403;aspect-ratio:3/4;max-height:58svh;width:100%;border:1px solid var(--hair-2);box-shadow:inset 0 0 60px rgba(0,0,0,.6);}
  .vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .vf video.mirror{transform:scaleX(-1);}
  .vf .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.45;}
  .vf .msg .mark{width:40px;height:29px;opacity:.5;}
  .vf .flash{position:absolute;inset:0;background:#FFF6E6;opacity:0;pointer-events:none;}
  .vf .flash.on{animation:flash .45s ease-out;}
  @keyframes flash{0%{opacity:.9}100%{opacity:0}}
  .vf .corner{position:absolute;left:12px;top:12px;font-family:var(--mono);font-size:10px;letter-spacing:1.6px;color:rgba(244,236,221,.75);text-transform:uppercase;text-shadow:0 1px 6px #000;}
  .controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:18px;}
  .controls > :first-child{justify-self:start;} .controls > :last-child{justify-self:end;}
  .shutter{width:80px;height:80px;border-radius:50%;position:relative;background:radial-gradient(circle at 50% 38%,var(--brass-hi),var(--brass) 62%,#B98A2F);
    box-shadow:0 0 0 5px var(--bg),0 0 0 7px rgba(230,180,80,.55),0 18px 40px -10px rgba(230,180,80,.5);transition:transform .12s var(--ease);}
  .shutter:active{transform:scale(.93);}
  .shutter[disabled]{opacity:.32;box-shadow:0 0 0 5px var(--bg),0 0 0 7px var(--hair-2);cursor:default;}
  .shutter.busy::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid transparent;border-top-color:var(--brass);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .round{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--hair);color:var(--cream);}
  .round svg{width:22px;height:22px;}
  .round[hidden]{display:grid;visibility:hidden;}
  .btn2[hidden]{display:none;}
  .queue{min-height:18px;margin-top:14px;text-align:center;font-family:var(--mono);font-size:11.5px;letter-spacing:.3px;color:var(--muted);}
  .queue.warn{color:#F0B36A;}
  .guest .develop{margin-top:16px;}
  .guest .develop .cal{display:inline-flex;align-items:center;gap:6px;margin-top:2px;font-size:13.5px;font-weight:600;color:var(--brass);text-decoration:none;}
  .guest .fine{margin-top:14px;}
  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;max-width:min(92vw,440px);padding:12px 16px;border-radius:14px;
    background:var(--surface-2);border:1px solid var(--hair-2);font-size:14px;line-height:1.4;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:fade .25s var(--ease);}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:18px;}
  .grid button{position:relative;aspect-ratio:1;overflow:hidden;border-radius:6px;background:var(--surface);display:block;width:100%;}
  .grid img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s var(--ease);}
  .grid img.loaded{opacity:1;}
  .grid .by{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;font-size:10.5px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:linear-gradient(transparent,rgba(0,0,0,.72));}
  .grid .play{position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;}
  .grid .play svg{width:10px;height:10px;}
  .empty-album{margin-top:30px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5;}
  .more{margin:16px auto 0;}
  .lightbox{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;background:rgba(5,4,3,.97);animation:fade .2s var(--ease);}
  .lb-top,.lb-bot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;}
  .lb-bot{padding:10px 14px calc(16px + env(safe-area-inset-bottom));}
  .lb-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px;}
  .lb-stage img,.lb-stage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;}
  .lb-who b{display:block;font-size:15px;font-weight:600;}
  .lb-who span{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .lb-nav{display:flex;gap:8px;}
  /* Tap targets ≥ 44 px (F10). */
  .copy{min-height:44px;}
  .wordmark{min-height:44px;}
  .footer a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;}
  .lost .alt a{display:inline-flex;align-items:center;min-height:44px;}
  .btn2{min-height:44px;}
  .linkbtn{display:flex;align-items:center;justify-content:center;min-height:44px;min-width:120px;margin:6px auto 0;}
  .guest .develop .cal{min-height:44px;}
  .cta[disabled]{opacity:.55;cursor:default;}
  .cta[disabled]::after{display:none;}
  .develop .label.note{display:block;white-space:normal;text-transform:none;letter-spacing:.1px;font-family:var(--body);font-size:13.5px;line-height:1.45;color:var(--muted);}
  :focus-visible{outline:2px solid var(--brass);outline-offset:3px;}

  @media (prefers-reduced-motion:reduce){
    .cover img,.leak,.grain,.cta::after,.chip .dot,.modal,.panel,.lightbox,.toast{animation:none!important;}
    .rise{animation-duration:.01s;}
  }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div id="app"><div class="loading" role="status" aria-label="Opening your invitation"><span class="mark"></span></div></div>

<script src="/assets/qrcode.min.js" defer></script>
<script>
(function () {
  "use strict";
  // Two known deployments only. Browser guests join/shoot on ONE of them:
  //   ?backend=dev|prod  →  that one (testers point the page at dev this way)
  //   localhost          →  dev
  //   anything else      →  prod (getfilmsera.cam)
  // The read-only invite preview keeps its old fallback (production first, then
  // dev, for films made by debug builds) when no backend is given.
  const DEPLOYMENTS = {
    prod: { cloud: "https://elated-gopher-868.convex.cloud", site: "https://elated-gopher-868.convex.site" },
    dev: { cloud: "https://resilient-goat-339.convex.cloud", site: "https://resilient-goat-339.convex.site" },
  };
  const APP_STORE = "https://apps.apple.com/us/app/filmsera-group-film-camera/id6781880091";
  const SITE = "https://getfilmsera.cam";

  const params = new URLSearchParams(location.search);
  const asked = params.get("backend");
  const explicitBackend = asked === "dev" || asked === "prod" ? asked : (location.hostname === "localhost" ? "dev" : null);
  const WEB = explicitBackend || "prod";
  const API = DEPLOYMENTS[WEB].site;

  const app = document.getElementById("app");
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  // Accept the canonical /join/XXXX route and the older ?code= links.
  function readCode() {
    const m = location.pathname.match(/^\/join\/([A-Za-z0-9]{4,16})\/?$/);
    return (params.get("code") || (m && m[1]) || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 16);
  }
  // The invite Worker injects the film it found (and on which deployment). An
  // explicit ?backend= wins over it, so testers always see the deployment they asked for.
  const injected = !explicitBackend ? readInjected() : null;
  function readInjected() {
    // The Worker writes the film into a non-executable JSON block (CSP-safe).
    try { const el = document.getElementById("invite-data"); if (el) return JSON.parse(el.textContent); } catch (_) {}
    return null;
  }
  const code = (injected && injected.code) || readCode();
  const link = `${SITE}/join/${encodeURIComponent(code)}`;
  // Where this guest's page lives (keeps ?backend= so a reload or calendar link comes back here).
  const pageLink = (() => {
    const u = new URL(location.origin + location.pathname);
    if (!/^\/join\//.test(location.pathname)) u.searchParams.set("code", code);
    if (asked === "dev" || asked === "prod") u.searchParams.set("backend", asked);
    return u.toString();
  })();
  const banner = document.getElementById("smartBanner");
  if (banner && code) banner.content = `app-id=6781880091, app-argument=${link}`;

  const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const flipIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9.5 13.5a2.6 2.6 0 0 0 4.6 1.4M14.5 12.5a2.6 2.6 0 0 0-4.6-1.4"/><path d="M14.5 10v2.5H12M9.5 16v-2.5H12"/></svg>';
  const playIcon = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z" fill="#F4ECDD"/></svg>';

  function initials(name) {
    return String(name || "").trim().split(/\s+/).slice(0, 2).map(s => s[0] || "").join("").toUpperCase() || "★";
  }
  function developsText(ts) {
    const d = new Date(ts), now = new Date();
    const days = (d - now) / 864e5;
    const time = d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
    if (days >= 0 && days < 6) return `${d.toLocaleDateString(undefined, {weekday:"short"})} ${time}`;
    return `${d.toLocaleDateString(undefined, {month:"short", day:"numeric"})}, ${time}`;
  }

  // ---------------------------------------------------------------- invitation

  let filmBackend = null; // the deployment the invite preview came from
  const canWebJoin = () => filmBackend === WEB;
  // Set when the host removed this browser's guest (the page then stops offering web join).
  const RKEY = `filmsera.webjoin.removed.${WEB}.${code}`;
  const wasRemoved = () => { try { return localStorage.getItem(RKEY) === "1"; } catch (_) { return false; } };

  function invitationHTML(f) {
    const revealed = f.status === "revealed" || (f.revealAt && f.revealAt <= Date.now());
    const shots = f.shotsPerPerson ? `<b>${Math.round(f.shotsPerPerson)} shots</b> each` : "";
    const when = revealed ? "Developed" : (f.revealAt ? `Develops <b>${esc(developsText(f.revealAt))}</b>` : "");
    const meta = [shots, when].filter(Boolean).join(" · ");
    const members = Math.max(1, Math.round(f.memberCount || 1));
    const cap = Math.round(f.guestCap || 0);
    const frames = cap && cap <= 24
      ? `<span class="frames" aria-hidden="true">${Array.from({length:cap}, (_, i) => `<span class="${i < members ? "on" : ""}"></span>`).join("")}</span>`
      : "";
    const spots = cap ? `${members} of ${cap} joined` : `${members} ${members === 1 ? "person" : "people"} in`;
    const develop = revealed
      ? `<div class="develop rise" style="animation-delay:.32s"><div class="label">The reveal<strong>This film has developed</strong></div></div>`
      : (f.revealAt ? `<div class="develop rise" style="animation-delay:.32s"><div class="label">Until the reveal<strong>${esc(new Date(f.revealAt).toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"}))}</strong></div>
          <div class="clock" data-countdown="${f.revealAt}">${["D","H","M","S"].map(u => `<div class="unit"><b>--</b><i>${u}</i></div>`).join("")}</div></div>` : "");
    // Web join is offered only where it can work (F8): not for host-only films,
    // not for a full film, not after the host removed this browser.
    const webBlocked = f.hostOnly ? "The host keeps this film's album private, so join in the Filmsera app."
      : wasRemoved() ? "The host removed you from this film."
      : f.ended ? "This film has ended." : "";
    const appLinks = `<div class="alts rise" style="animation-delay:.52s"><a class="btn2" href="${esc(link)}" data-join>Open in the app</a><a class="btn2" href="${APP_STORE}">Get the iPhone app</a></div>`;
    const actions = canWebJoin() && webBlocked
      ? `<a class="cta rise" style="animation-delay:.48s" href="${esc(link)}" data-join>${revealed ? "See the photos" : "Join this film"} ${arrow}</a>
         <div class="fine rise" style="animation-delay:.56s">${esc(webBlocked)}</div>`
      : canWebJoin() && f.full
      ? `<button class="cta rise" style="animation-delay:.48s" type="button" disabled aria-disabled="true">This film is full</button>
         ${appLinks}
         <div class="fine rise" style="animation-delay:.56s">Every spot is taken. Ask the host to make room.</div>`
      : canWebJoin()
      ? `<button class="cta rise" style="animation-delay:.48s" type="button" data-webjoin>${revealed ? "See the photos in your browser" : "Join in your browser"} ${arrow}</button>
         ${appLinks}
         <div class="fine rise" style="animation-delay:.56s">${revealed ? "No app or account needed." : "No app or account needed · Your photos stay hidden until the reveal."}</div>`
      : `<a class="cta rise" style="animation-delay:.48s" href="${esc(link)}" data-join>${revealed ? "See the photos" : "Join this film"} ${arrow}</a>
         <div class="fine rise" style="animation-delay:.56s">${revealed ? "Open Filmsera to see every roll." : "Free for guests · Your photos stay hidden until the reveal."}</div>`;
    return `
      <section class="invite" aria-label="Invitation to ${esc(f.title)}">
        <div class="cover${f.coverUrl ? "" : " empty"}">${f.coverUrl ? `<img src="${esc(f.coverUrl)}" alt="" decoding="async">` : ""}</div>
        <div class="leak" aria-hidden="true"></div>
        <div class="topbar">
          <a class="wordmark" href="/" style="font-size:20px"><span class="mark"></span>Filmsera</a>
          <span class="chip"><span class="dot"></span>Private invite</span>
        </div>
        <div class="sheet">
          <div class="host rise"><span class="avatar">${esc(initials(f.hostName))}</span>${f.hostName ? `${esc(f.hostName)} invited you` : "You're invited"}</div>
          <h1 class="title rise" style="animation-delay:.08s">${esc(f.title)}</h1>
          ${meta ? `<div class="meta rise" style="animation-delay:.16s">${meta}</div>` : ""}
          ${develop}
          <div class="spots rise" style="animation-delay:.4s">${frames}<span>${esc(spots)}</span></div>
          ${actions}
          <div class="code rise" style="animation-delay:.62s"><div><div class="k">INVITE CODE</div><div class="v">${esc(code)}</div></div>
            <button class="copy" type="button" data-copy>Copy code</button></div>
        </div>
      </section>`;
  }

  function howHTML(f) {
    const n = f.shotsPerPerson ? Math.round(f.shotsPerPerson) : null;
    const web = canWebJoin();
    return `
      <section class="how">
        <div class="eyebrow">How a Film works</div>
        <h2>Shoot now. <em>See it all</em> at the reveal.</h2>
        <ol class="steps">
          <li><span class="n">01</span><div><b>Join with your name</b><p>${web ? "Right here in your browser, or in the free Filmsera app. No account needed." : "Get Filmsera free and tap Join. No account fuss for guests."}</p></div></li>
          <li><span class="n">02</span><div><b>${n ? `Take your ${n} shots` : "Take your shots"}</b><p>Like a disposable camera — every frame counts, and no one sees them yet.</p></div></li>
          <li><span class="n">03</span><div><b>Everyone's roll develops together</b><p>${f.revealAt ? `At ${esc(developsText(f.revealAt))}, ` : "At the reveal, "}every photo from every guest appears at once.</p></div></li>
        </ol>
        <div class="footer">
          <a class="badge" href="${APP_STORE}"><img src="/shots/app-store-badge.svg" alt="Download on the App Store" /></a>
          <span><a href="/">getfilmsera.cam</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></span>
        </div>
      </section>`;
  }

  function deskHTML(f) {
    const revealed = f.status === "revealed" || (f.revealAt && f.revealAt <= Date.now());
    return `
      <aside class="desk">
        <a class="wordmark" href="/"><span class="mark"></span>Filmsera</a>
        <div class="eyebrow">${f.hostName ? `${esc(f.hostName)} invited you to` : "You're invited to"}</div>
        <h2>${esc(f.title)}</h2>
        <p class="lead">${revealed
          ? "This Film has developed. Open it on your iPhone to see every guest's roll."
          : "A shared disposable camera for everyone there. Shoot your frames on your phone — no one sees them until the whole roll develops at once."}</p>
        <div class="scan">
          <div class="qr" id="qr" aria-label="QR code to open this invitation on your phone"></div>
          <div><b>Scan to join on your phone</b><p>Point your phone's camera here. Join in the browser, or in Filmsera on iPhone.</p></div>
        </div>
        <div class="row">
          <a class="badge" href="${APP_STORE}"><img src="/shots/app-store-badge.svg" alt="Download on the App Store" style="height:48px" /></a>
          <div class="code"><div><div class="k">INVITE CODE</div><div class="v">${esc(code)}</div></div>
            <button class="copy" type="button" data-copy>Copy</button></div>
        </div>
      </aside>`;
  }

  let clockTimer = null;
  function startClocks(onZero) {
    clearInterval(clockTimer);
    const clocks = app.querySelectorAll("[data-countdown]");
    if (!clocks.length) return;
    let fired = false;
    const tick = () => clocks.forEach(c => {
      const left = +c.dataset.countdown - Date.now();
      let s = Math.max(0, Math.floor(left / 1000));
      const parts = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
      c.querySelectorAll("b").forEach((b, i) => { const v = String(parts[i]).padStart(2, "0"); if (b.textContent !== v) b.textContent = v; });
      if (left <= 0 && !fired && onZero) { fired = true; onZero(); }
    });
    tick(); clockTimer = setInterval(tick, 1000);
  }

  function wire(f) {
    app.querySelectorAll(".cover img").forEach(img => {
      const show = () => img.classList.add("loaded");
      img.complete && img.naturalWidth ? show() : img.addEventListener("load", show, {once:true});
    });
    app.querySelectorAll("[data-copy]").forEach(btn => btn.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(code); } catch (_) {}
      const label = btn.textContent;
      btn.textContent = "Copied ✓"; btn.classList.add("done");
      setTimeout(() => { btn.textContent = label; btn.classList.remove("done"); }, 1800);
    }));
    // The app may not be installed. Try the app first; if the page is still
    // showing a moment later, go to the App Store. The code is copied either
    // way so it can be pasted into Films › Join after installing.
    app.querySelectorAll("[data-join]").forEach(a => a.addEventListener("click", e => {
      e.preventDefault();
      try { navigator.clipboard && navigator.clipboard.writeText(code); } catch (_) {}
      if (!isIOS) { location.href = APP_STORE; return; }
      const fallback = setTimeout(() => { location.href = APP_STORE; }, 1500);
      const cancel = () => clearTimeout(fallback);
      window.addEventListener("pagehide", cancel, {once:true});
      document.addEventListener("visibilitychange", () => { if (document.hidden) cancel(); }, {once:true});
      location.href = `filmcamera://join/${encodeURIComponent(code)}`;
    }));
    app.querySelectorAll("[data-webjoin]").forEach(b => b.addEventListener("click", () => openJoinSheet(f)));
    startClocks();
    const qrBox = document.getElementById("qr");
    if (qrBox) {
      const draw = () => {
        if (!window.qrcode) return false;
        const q = window.qrcode(0, "M"); q.addData(canWebJoin() ? pageLink : link); q.make();
        const n = q.getModuleCount(); let d = "";
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
        qrBox.innerHTML = `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}" fill="#0A0807"/></svg>`;
        return true;
      };
      if (!draw()) window.addEventListener("load", draw, {once:true});
    }
  }

  let layoutListener = null;
  const mq = window.matchMedia("(min-width:900px)");
  function render(f) {
    if (!f) return renderLost();
    document.title = `${f.title} · You're invited · Filmsera`;
    // Phones get the invitation full-bleed plus "how it works"; desktops the mock-up.
    const layout = () => {
      if (mq.matches) { app.innerHTML = `<main class="stage"><div class="phone"><div class="screen">${invitationHTML(f)}</div></div>${deskHTML(f)}</main>`; }
      else { app.innerHTML = `<main>${invitationHTML(f)}${howHTML(f)}</main>`; }
      wire(f);
    };
    layout();
    stopLayout();
    layoutListener = () => layout();
    mq.addEventListener ? mq.addEventListener("change", layoutListener) : mq.addListener(layoutListener);
  }
  function stopLayout() {
    if (!layoutListener) return;
    mq.removeEventListener ? mq.removeEventListener("change", layoutListener) : mq.removeListener(layoutListener);
    layoutListener = null;
  }

  function renderLost(offline) {
    stopLayout();
    document.title = "Invitation not found · Filmsera";
    app.innerHTML = `
      <main class="lost">
        <div class="print rise" aria-hidden="true"><div><span class="mark"></span></div></div>
        <h1 class="rise" style="animation-delay:.08s">${offline ? "We couldn't open<br>your invitation" : "This invitation<br>didn't develop"}</h1>
        <p class="rise" style="animation-delay:.16s">${offline
          ? "Check your connection and try again."
          : (code ? `The code <b style="color:var(--cream);font-family:var(--mono)">${esc(code)}</b> doesn't match a Film. It may have a typo, or the Film has ended.` : "Enter the invite code your host shared with you.")}</p>
        <form class="rise" style="animation-delay:.24s" id="codeForm" autocomplete="off">
          <input name="code" maxlength="16" placeholder="INVITE CODE" aria-label="Invite code" autocapitalize="characters" spellcheck="false" value="" />
          <button class="cta" type="submit">Open ${arrow}</button>
        </form>
        <div class="alt rise" style="animation-delay:.32s">New to Filmsera? <a href="${APP_STORE}">Get the app — it's free →</a></div>
      </main>`;
    document.getElementById("codeForm").addEventListener("submit", e => {
      e.preventDefault();
      const v = e.target.code.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (!v) return;
      location.href = explicitBackend && asked ? `/join.html?code=${v}&backend=${asked}` : `/join/${v}`;
    });
  }

  function toast(msg, ms = 4200) {
    const el = document.createElement("div");
    el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), ms);
  }

  // ---------------------------------------------------------------- web API

  /**
   * POST to a /web/* endpoint. Resolves {status, json}; rejects on network
   * failure or after `timeout` ms (the request is aborted — finding F2).
   */
  async function api(path, { body, token, raw, type, timeout = 20000, base = API } = {}) {
    const headers = {};
    if (token) headers.Authorization = `Bearer ${token}`;
    let payload;
    if (raw) { payload = raw; headers["Content-Type"] = type || "image/jpeg"; }
    else { payload = JSON.stringify(body || {}); headers["Content-Type"] = "application/json"; }
    const url = path.startsWith("http") ? path : `${base}${path}`;
    if (!url.startsWith(`${base}/web/`)) throw new Error("Unexpected upload URL");
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeout);
    try {
      const r = await fetch(url, { method: "POST", headers, body: payload, mode: "cors", credentials: "omit", signal: ctl.signal });
      let json = null;
      try { json = await r.json(); } catch (_) {
        if (ctl.signal.aborted) throw new Error("timeout");
        json = { ok: false, code: "bad_response", error: "Something went wrong." };
      }
      return { status: r.status, json };
    } finally { clearTimeout(timer); }
  }

  // Session per deployment + code, so reloading resumes as the same guest.
  const SKEY = `filmsera.webjoin.${WEB}.${code}`;
  const session = {
    get() { try { const s = JSON.parse(localStorage.getItem(SKEY) || "null"); return s && typeof s.token === "string" ? s : null; } catch (_) { return null; } },
    set(s) { try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (_) {} },
    clear() { try { localStorage.removeItem(SKEY); } catch (_) {} },
  };

  // ---------------------------------------------------------------- join sheet

  function openJoinSheet(f) {
    const prev = document.querySelector(".modal"); if (prev) prev.remove();
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `
      <form class="panel" role="dialog" aria-modal="true" aria-labelledby="jn-h" novalidate>
        <div class="eyebrow">${esc(f.title)}</div>
        <h2 id="jn-h">What should we call you?</h2>
        <p class="sub">Your name goes on your photos when the film develops.</p>
        <input class="field" name="name" maxlength="40" autocomplete="nickname" placeholder="Your name" aria-label="Your name" required />
        <div class="err" role="alert"></div>
        <button class="cta" type="submit">Join ${arrow}</button>
        <p class="fine">No account needed. By joining you agree to the <a href="/terms.html" target="_blank" rel="noopener">Terms</a> and <a href="/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</p>
        <button class="linkbtn" type="button" data-close>Not now</button>
      </form>`;
    const opener = document.activeElement;
    document.body.appendChild(m);
    const form = m.querySelector("form"), input = form.name, err = form.querySelector(".err"), btn = form.querySelector(".cta");
    const close = (restore = true) => {
      m.remove(); document.removeEventListener("keydown", onKey);
      if (restore && opener && opener.isConnected && opener.focus) opener.focus();
    };
    const onKey = e => { if (e.key === "Escape") close(); else trapTab(e, form); };
    document.addEventListener("keydown", onKey);
    m.addEventListener("click", e => { if (e.target === m) close(); });
    m.querySelector("[data-close]").addEventListener("click", close);
    setTimeout(() => input.focus(), 50);
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const name = input.value.replace(/\s+/g, " ").trim();
      if (!name) { err.textContent = "Type your name to join."; input.focus(); return; }
      if (name.length > 40) { err.textContent = "Keep your name under 40 characters."; return; }
      err.textContent = ""; btn.disabled = true;
      try {
        const { json } = await api("/web/join", { body: { code, name } });
        if (!json.ok) { err.textContent = json.error || "Couldn't join. Try again."; btn.disabled = false; return; }
        session.set({ token: json.token, name: json.name, joinedAt: Date.now() });
        G.token = json.token;
        close(false);
        startGuest(json);
      } catch (_) {
        err.textContent = "No connection. Check your signal and try again."; btn.disabled = false;
      }
    });
  }

  /** Keep Tab / Shift+Tab inside a dialog (F11). */
  function trapTab(e, root) {
    if (e.key !== "Tab") return;
    const els = [...root.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),video[controls],[tabindex]:not([tabindex="-1"])')]
      .filter(el => el.offsetParent !== null || el === document.activeElement);
    if (!els.length) return;
    const first = els[0], last = els[els.length - 1];
    if (e.shiftKey && (document.activeElement === first || !root.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || !root.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
  }

  // ---------------------------------------------------------------- pending shots (IndexedDB)

  // Every shot is saved on the device before it uploads, and only removed once
  // the server has committed it — so a dropped connection never loses a frame.
  // Bytes are stored as ArrayBuffers (WebKit private mode can't store Blobs).
  // If the browser can't persist at all, `put` reports it and the page says
  // "keep this page open" instead of claiming the shot is saved (F3).
  const store = (() => {
    const mem = new Map();
    let dbp = null;
    function db() {
      if (!("indexedDB" in window)) return Promise.reject(new Error("no idb"));
      if (!dbp) dbp = new Promise((res, rej) => {
        const r = indexedDB.open("filmsera-webjoin", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("pending", { keyPath: "id" });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      return dbp;
    }
    const tx = (mode, fn) => db().then(d => new Promise((res, rej) => {
      const t = d.transaction("pending", mode); const os = t.objectStore("pending");
      const out = fn(os);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      t.onerror = () => rej(t.error);
    }));
    return {
      async put(item) {
        mem.set(item.id, item);
        try { await tx("readwrite", os => os.put(item)); item.persisted = true; } catch (_) { item.persisted = false; }
        return item.persisted;
      },
      async del(id) { mem.delete(id); try { await tx("readwrite", os => os.delete(id)); } catch (_) {} },
      async list() {
        try {
          const all = await tx("readonly", os => os.getAll());
          for (const it of all || []) if (!mem.has(it.id)) mem.set(it.id, { ...it, persisted: true });
        } catch (_) {}
        return [...mem.values()].filter(it => it.skey === SKEY).sort((a, b) => a.capturedAt - b.capturedAt);
      },
    };
  })();

  // ---------------------------------------------------------------- image pipeline

  const FULL_EDGE = 2560, THUMB_EDGE = 480;

  // A light film grade so browser shots sit next to app shots: gentle S-curve,
  // lifted blacks, warm highlights, a touch less saturation. (Not the film's own
  // Look — the app's LUTs aren't available on the web.)
  const GRADE = (() => {
    const r = new Uint8ClampedArray(256), g = new Uint8ClampedArray(256), b = new Uint8ClampedArray(256);
    for (let i = 0; i < 256; i++) {
      const x = i / 255;
      const s = 0.5 - 0.5 * Math.cos(Math.PI * x);
      const y = 0.03 + (x * 0.78 + s * 0.22) * 0.95;
      r[i] = 255 * Math.pow(y, 0.96);
      g[i] = 255 * y;
      b[i] = 255 * (Math.pow(y, 1.05) * 0.96 + 0.012);
    }
    return { r, g, b, sat: 0.9 };
  })();
  function grade(ctx, w, h) {
    try {
      const img = ctx.getImageData(0, 0, w, h), d = img.data, { r, g, b, sat } = GRADE;
      for (let i = 0; i < d.length; i += 4) {
        const R = r[d[i]], G = g[d[i + 1]], B = b[d[i + 2]];
        const l = 0.299 * R + 0.587 * G + 0.114 * B;
        d[i] = l + (R - l) * sat; d[i + 1] = l + (G - l) * sat; d[i + 2] = l + (B - l) * sat;
      }
      ctx.putImageData(img, 0, 0);
    } catch (_) { /* grading is best-effort */ }
  }
  const fit = (w, h, edge) => { const k = Math.min(1, edge / Math.max(w, h)); return [Math.max(1, Math.round(w * k)), Math.max(1, Math.round(h * k))]; };
  const toBlob = (canvas, q) => new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error("encode failed")), "image/jpeg", q));

  /** Draw a frame (video / bitmap / image) into a graded 2560px JPEG + 480px thumb. */
  async function develop(src, sw, sh, mirror) {
    const [w, h] = fit(sw, sh, FULL_EDGE);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    if (mirror) { ctx.translate(w, 0); ctx.scale(-1, 1); }
    ctx.drawImage(src, 0, 0, w, h);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    grade(ctx, w, h);
    const [tw, th] = fit(w, h, THUMB_EDGE);
    const t = document.createElement("canvas"); t.width = tw; t.height = th;
    const tctx = t.getContext("2d"); tctx.imageSmoothingQuality = "high"; tctx.drawImage(c, 0, 0, tw, th);
    return { image: await toBlob(c, 0.85), thumb: await toBlob(t, 0.72) };
  }

  /** Is this file HEIC/HEIF (by type, name or magic bytes)? */
  async function isHeic(file) {
    if (/hei[cf]/i.test(file.type) || /\.hei[cf]$/i.test(file.name || "")) return true;
    try {
      const b = new Uint8Array(await file.slice(0, 12).arrayBuffer());
      return String.fromCharCode(...b.slice(4, 8)) === "ftyp" && /^(hei[cxms]|hev[cx]|mif1|msf1)$/.test(String.fromCharCode(...b.slice(8, 12)));
    } catch (_) { return false; }
  }

  /** Decode a picked file with EXIF orientation applied. */
  async function decodeFile(file) {
    if (window.createImageBitmap) {
      try { const bm = await createImageBitmap(file, { imageOrientation: "from-image" }); return { src: bm, w: bm.width, h: bm.height }; } catch (_) {}
    }
    const url = URL.createObjectURL(file);
    try {
      const img = new Image(); img.decoding = "async"; img.src = url;
      await img.decode(); // <img> applies EXIF orientation (image-orientation: from-image)
      return { src: img, w: img.naturalWidth, h: img.naturalHeight };
    } finally { setTimeout(() => URL.revokeObjectURL(url), 1000); }
  }

  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
    "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16))).toUpperCase();

  // ---------------------------------------------------------------- guest state

  const G = { token: null, name: "", film: null, shotsUsed: 0, shotsLeft: null, canShoot: true, pending: 0 };
  let pollTimer = null, stream = null, facing = "environment", mode = null; // mode: "camera" | "album"

  function applyStatus(j) {
    G.name = j.name ?? G.name;
    if (j.film) G.film = j.film;
    if ("shotsUsed" in j) G.shotsUsed = j.shotsUsed;
    if ("shotsLeft" in j) G.shotsLeft = j.shotsLeft;
    if ("canShoot" in j) G.canShoot = j.canShoot;
  }
  const effectiveLeft = () => G.shotsLeft === null ? null : Math.max(0, G.shotsLeft - G.pending);

  /** The server said this token is done: bad (deleted film), expired, or removed by the host. */
  const SESSION_END = { bad_token: "Your session ended. Join the film again.",
    expired: "Browser access to this film has ended. Open it in the Filmsera app.",
    removed: "The host removed you from this film." };
  const isSessionEnd = (status, j) => status === 401 || (j && (j.code === "removed" || j.code === "expired" || j.code === "bad_token"));
  function endSession(j) {
    const codeName = (j && j.code) || "bad_token";
    if (codeName === "removed") { try { localStorage.setItem(RKEY, "1"); } catch (_) {} }
    session.clear(); stopCamera(); clearInterval(pollTimer); mode = null;
    toast(SESSION_END[codeName] || SESSION_END.bad_token);
    load(true);
  }

  async function refreshStatus() {
    try {
      const { status, json } = await api("/web/status", { token: G.token });
      if (isSessionEnd(status, json)) return endSession(json);
      if (!json.ok) return;
      applyStatus(json);
      if (G.film.status === "revealed" && mode !== "album") renderAlbum();
      else if (mode === "camera") paintCounter();
    } catch (_) { /* offline: keep showing what we have */ }
  }

  function startGuest(j) {
    applyStatus(j);
    stopLayout();
    clearInterval(pollTimer);
    pollTimer = setInterval(refreshStatus, 30000);
    if (!startGuest.wired) { startGuest.wired = true; document.addEventListener("visibilitychange", () => { if (!document.hidden && G.token) refreshStatus(); }); }
    if (G.film.status === "revealed") renderAlbum(); else renderCamera();
    pump();
  }

  async function resume(s) {
    G.token = s.token; G.name = s.name || "";
    try {
      const { status, json } = await api("/web/status", { token: s.token });
      if (isSessionEnd(status, json)) {
        session.clear();
        if (json && json.code === "removed") { try { localStorage.setItem(RKEY, "1"); } catch (_) {} }
        if (json && json.code !== "bad_token") toast(SESSION_END[json.code] || SESSION_END.bad_token);
        return false;
      }
      if (!json.ok) return false;
      startGuest(json);
      return true;
    } catch (_) {
      return false;
    }
  }

  // ---------------------------------------------------------------- camera view

  function icsHref(f) {
    const stamp = d => new Date(d).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
    const e = v => String(v).replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
    const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Filmsera//Web join//EN", "BEGIN:VEVENT",
      `UID:${code}-reveal@getfilmsera.cam`, `DTSTAMP:${stamp(Date.now())}`, `DTSTART:${stamp(f.revealAt)}`, `DTEND:${stamp(f.revealAt + 30 * 60000)}`,
      `SUMMARY:${e(`${f.title} develops on Filmsera`)}`, `DESCRIPTION:${e(`Everyone's photos appear at once. Open ${pageLink}`)}`, `URL:${pageLink}`,
      "BEGIN:VALARM", "TRIGGER:PT0M", "ACTION:DISPLAY", `DESCRIPTION:${e(`${f.title} has developed`)}`, "END:VALARM",
      "END:VEVENT", "END:VCALENDAR"];
    return "data:text/calendar;charset=utf-8," + encodeURIComponent(lines.map(foldIcs).join("\r\n"));
  }

  /** RFC 5545 §3.1: fold content lines longer than 75 octets (CRLF + space), never splitting a character. */
  function foldIcs(line) {
    const enc = new TextEncoder();
    if (enc.encode(line).length <= 75) return line;
    const out = []; let cur = "", n = 0, limit = 75;
    for (const ch of line) {
      const len = enc.encode(ch).length;
      if (n + len > limit) { out.push(cur); cur = ""; n = 0; limit = 74; } // continuation lines start with a space
      cur += ch; n += len;
    }
    out.push(cur);
    return out.join("\r\n ");
  }

  function renderCamera() {
    mode = "camera";
    const f = G.film;
    document.title = `${f.title} · Filmsera`;
    const revealNote = f.revealAt
      ? `<div class="develop"><div class="label">Develops<strong>${esc(developsText(f.revealAt))}</strong></div>
          <div class="clock" data-countdown="${f.revealAt}">${["D","H","M","S"].map(u => `<div class="unit"><b>--</b><i>${u}</i></div>`).join("")}</div>
          <div class="label note">Come back at ${esc(new Date(f.revealAt).toLocaleString(undefined, {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}))} to see everyone's photos.</div>
          <a class="cal" href="${icsHref(f)}" download="filmsera-reveal.ics">＋ Add to calendar</a></div>`
      : `<div class="develop"><div class="label note">The host develops this film. Come back to this page to see everyone's photos.</div></div>`;
    app.innerHTML = `
      <main class="guest">
        <div class="g-top"><a class="wordmark" href="/" style="font-size:20px"><span class="mark"></span>Filmsera</a><span class="chip"><span class="dot"></span>${esc(G.name)}</span></div>
        <h1 class="g-title">${esc(f.title)}</h1>
        <div class="g-row"><div class="count" id="count"></div><span class="frames" id="frames" aria-hidden="true"></span></div>
        <div class="vf" id="vf">
          <video id="video" playsinline muted autoplay aria-label="Camera viewfinder"></video>
          <div class="msg" id="vfmsg"><span class="mark"></span><span>Starting the camera…</span></div>
          <span class="corner" id="corner"></span>
          <div class="flash" id="flash"></div>
        </div>
        <div class="controls">
          <button class="round" id="flip" type="button" aria-label="Switch camera" hidden>${flipIcon}</button>
          <button class="shutter" id="shutter" type="button" aria-label="Take a photo"></button>
          <span class="round" style="visibility:hidden" aria-hidden="true"></span>
        </div>
        <input id="file" type="file" accept="image/*" capture="environment" hidden />
        <div class="queue" id="queue" aria-live="polite"></div>
        ${revealNote}
        <p class="fine">Your shots stay sealed, like a real disposable. Nobody sees them, you included, until the film develops.</p>
      </main>`;
    startClocks(() => { // reveal time reached: the server flips it; poll until it does
      let n = 0; const t = setInterval(() => { if (mode !== "camera" || ++n > 24) return clearInterval(t); refreshStatus(); }, 5000);
      refreshStatus();
    });
    document.getElementById("shutter").addEventListener("click", onShutter);
    document.getElementById("flip").addEventListener("click", () => { facing = facing === "environment" ? "user" : "environment"; startCamera(); });
    document.getElementById("file").addEventListener("change", onFile);
    paintCounter(); paintQueue();
    startCamera();
  }

  function paintCounter() {
    const el = document.getElementById("count"); if (!el) return;
    const left = effectiveLeft();
    const total = G.film.shotsPerPerson > 0 ? G.film.shotsPerPerson : null;
    el.innerHTML = left === null
      ? `<b>${String(G.shotsUsed + G.pending).padStart(2, "0")}</b><span>shots taken</span>`
      : `<b>${String(left).padStart(2, "0")}</b><span>${left === 1 ? "shot" : "shots"} left</span>`;
    const fr = document.getElementById("frames");
    if (fr) fr.innerHTML = total && total <= 36 ? Array.from({ length: total }, (_, i) => `<span class="${i < total - left ? "" : "on"}"></span>`).join("") : "";
    const shutter = document.getElementById("shutter");
    const done = (left === 0) || !G.canShoot;
    if (shutter) { shutter.disabled = done; shutter.setAttribute("aria-label", done ? "No shots left" : "Take a photo"); }
    const corner = document.getElementById("corner");
    if (corner) corner.textContent = done ? "Roll finished" : (total ? `Frame ${Math.min(total, total - left + 1)} / ${total}` : "");
    if (done && left === 0) {
      const msg = document.getElementById("vfmsg");
      stopCamera();
      if (msg) { msg.style.display = "flex"; msg.innerHTML = `<span class="mark"></span><span><b style="color:var(--cream)">That's your roll.</b><br>Your shots are sealed until the film develops.</span>`; }
    }
  }

  let unsaved = 0; // pending shots this browser could NOT persist (memory only)
  function paintQueue(state) {
    const q = document.getElementById("queue"); if (!q) return;
    q.classList.toggle("warn", state === "offline" || unsaved > 0);
    if (G.pending === 0) { q.textContent = G.shotsUsed && mode === "camera" ? "All shots saved ✓" : ""; return; }
    const n = G.pending, shots = n === 1 ? "shot" : "shots";
    if (unsaved > 0) {
      q.textContent = state === "offline"
        ? `Waiting for a connection. Keep this page open — this browser can't keep ${shots} if you close it.`
        : `Uploading ${n} ${shots}… keep this page open until it's done.`;
      return;
    }
    q.textContent = state === "offline"
      ? `${n} ${n === 1 ? "shot is" : "shots are"} saved on this phone — will upload when you're back online`

  function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    const v = document.getElementById("video"); if (v) v.srcObject = null;
  }

  async function startCamera() {
    stopCamera();
    const msg = document.getElementById("vfmsg"), v = document.getElementById("video"), flip = document.getElementById("flip");
    if (!v || effectiveLeft() === 0) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext) return fallback("This browser can't show a live viewfinder.");
    try {

        video: { facingMode: { ideal: facing }, width: { ideal: 2560 }, height: { ideal: 1920 } } });
      if (mode !== "camera") return stopCamera();
      v.srcObject = stream; v.classList.toggle("mirror", facing === "user");
      await v.play().catch(() => {});
      msg.style.display = "none";
      try {
        const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
        flip.hidden = cams.length < 2;
      } catch (_) { flip.hidden = true; }
    } catch (e) {
      fallback(e && e.name === "NotAllowedError" ? "Camera access is off for this page." : "The camera isn't available here.");
    }
    function fallback(why) {
      stream = null; flip.hidden = true;
      msg.style.display = "flex";
      msg.innerHTML = `<span class="mark"></span><span>${esc(why)}<br>Tap the shutter to take a photo with your phone's camera.</span>`;
    }
  }

  let shooting = false;
  async function onShutter() {
    if (shooting || effectiveLeft() === 0) return;
    const v = document.getElementById("video");
    if (!stream || !v || !v.videoWidth) { document.getElementById("file").click(); return; }
    shooting = true;
    const btn = document.getElementById("shutter"); btn.classList.add("busy");
    const fl = document.getElementById("flash"); fl.classList.remove("on"); void fl.offsetWidth; fl.classList.add("on");
    if (navigator.vibrate) navigator.vibrate(12);
    try {
      const out = await develop(v, v.videoWidth, v.videoHeight, facing === "user");
      await queueShot(out);
    } catch (_) { toast("That shot didn't take. Try again."); }
    finally { shooting = false; btn.classList.remove("busy"); }
  }

  async function onFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file || shooting || effectiveLeft() === 0) return;
    shooting = true;
    const btn = document.getElementById("shutter"); btn.classList.add("busy");
    try {
      let d;
      try { d = await decodeFile(file); } catch (_) {
        toast(await isHeic(file)
          ? "This photo format (HEIC) isn't supported in this browser. Take it with the camera button, or choose a JPEG."
          : "That photo couldn't be opened. Try a different photo.", 6000);
        return;
      }
      await queueShot(await develop(d.src, d.w, d.h, false));
      const fl = document.getElementById("flash"); fl.classList.remove("on"); void fl.offsetWidth; fl.classList.add("on");
    } catch (_) {
      toast("That photo couldn't be saved. Try again.");
    } finally { shooting = false; btn.classList.remove("busy"); }
  }

  async function queueShot({ image, thumb }) {
    const item = { id: uuid(), skey: SKEY, image: await image.arrayBuffer(), thumb: await thumb.arrayBuffer(), capturedAt: Date.now() };
    await store.put(item);
    G.pending++;
    unsaved = (await store.list()).filter(it => it.persisted === false).length;
    const b = document.querySelector("#count b"); if (b) { b.classList.add("tick"); setTimeout(() => b.classList.remove("tick"), 300); }
    paintCounter(); paintQueue();
    pump();
  }

  // ---------------------------------------------------------------- upload queue

  const PERMANENT = new Set(["no_shots", "host_only", "ended", "bad_type", "too_large", "bad_request"]);
  let pumping = false, pumpSince = 0, retryTimer = null, backoff = 2000;
  const byteLen = b => (b && (b.byteLength ?? b.size)) || 0;

  /**
   * Upload + commit one shot. Idempotent per shot id (F4): the server hands back
   * the same tickets (with `filled`) or `committed: true` if a lost commit already
   * landed. Every request has a timeout (F2); uploads get time for slow links.
   */
  async function uploadOne(item) {
    for (let attempt = 0; attempt < 2; attempt++) {
      const { json: u } = await api("/web/upload-url", { token: G.token, body: { photoClientId: item.id } });
      if (!u.ok || u.committed) return u;
      let restart = false;
      for (const kind of ["image", "thumb"]) {
        if (u[kind].filled) continue;
        const up = await api(u[kind].uploadUrl, { token: G.token, raw: item[kind], type: "image/jpeg",
          timeout: 30000 + byteLen(item[kind]) / 25 }); // ≥ 25 KB/s
        if (up.json.ok || up.json.code === "ticket_used") continue;
        if (up.json.code === "ticket_expired" || up.json.code === "bad_ticket") { restart = true; break; }
        return up.json;
      }
      if (restart) continue;
      const { json: c } = await api("/web/commit", { token: G.token, body: {
        photoClientId: item.id, imageTicket: u.image.ticket, thumbTicket: u.thumb.ticket, capturedAt: item.capturedAt } });
      if (c.ok || !["bad_ticket", "not_uploaded", "ticket_expired"].includes(c.code)) return c;
    }
    return { ok: false, code: "retry" };
  }

  /**
   * Drain the queue. One pass at a time, but a pass that has been running for
   * over 3 minutes is treated as wedged and superseded, so the lock can't stick.
   * A shot that fails transiently doesn't stop later shots from trying.
   */
  async function pump() {
    if (!G.token) return;
    if (pumping && Date.now() - pumpSince < 180000) return;
    const pass = pumpSince = Date.now();
    pumping = true; clearTimeout(retryTimer);
    const retrying = backoff > 2000; // keep the "waiting for a connection" line while retrying
    try {
      for (let round = 0; round < 20; round++) {
        const items = await store.list();
        G.pending = items.length; unsaved = items.filter(it => it.persisted === false).length;
        paintCounter(); paintQueue(retrying && round === 0 ? "offline" : undefined);
        if (!items.length) { backoff = 2000; return; }
        let progressed = false, transient = false;
        for (const item of items) {
          if (pumpSince !== pass) return; // superseded by a newer pass
          let res;
          try { res = await uploadOne(item); } catch (_) { transient = true; continue; }
          if (res.ok) {
            await store.del(item.id); applyStatus(res); progressed = true;
          } else if (["bad_token", "removed", "expired"].includes(res.code)) {
            return endSession(res);
          } else if (PERMANENT.has(res.code)) {
            await store.del(item.id); progressed = true;
            toast(res.code === "no_shots" ? "Your roll was already used up, so this extra shot wasn't saved." : (res.error || "A shot couldn't be saved."));
          } else {
            transient = true; // rate limited, shots_pending, server hiccup, timeout
          }
          const left = await store.list();
          G.pending = left.length; unsaved = left.filter(it => it.persisted === false).length;
          paintCounter(); paintQueue(transient ? "offline" : undefined);
        }
        if (transient) { paintQueue("offline"); schedule(); return; }
        if (!progressed) return;
      }
    } finally { if (pumpSince === pass) pumping = false; }
  }
  function schedule() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(pump, backoff);
    backoff = Math.min(backoff * 2, 60000);
  }
  window.addEventListener("online", () => { backoff = 2000; pump(); });

  // ---------------------------------------------------------------- album view

  let albumItems = [], albumCursor = null, albumDone = false, albumLoading = false;

  function renderAlbum() {
    mode = "album"; stopCamera(); clearInterval(clockTimer);
    const f = G.film;
    document.title = `${f.title} · Developed · Filmsera`;
    albumItems = []; albumCursor = null; albumDone = false;
    app.innerHTML = `
      <main class="guest">
        <div class="g-top"><a class="wordmark" href="/" style="font-size:20px"><span class="mark"></span>Filmsera</a><span class="chip"><span class="dot"></span>${esc(G.name)}</span></div>
        <div class="eyebrow" style="margin-top:20px">The film has developed</div>
        <h1 class="g-title" style="margin-top:8px">${esc(f.title)}</h1>
        <div class="meta" id="albmeta"></div>
        <div class="grid" id="grid" aria-label="Photos"></div>
        <div class="queue" id="queue" aria-live="polite"></div>
        <button class="btn2 more" id="more" type="button" hidden>Load more</button>
        <div class="footer" style="margin-top:30px">
          <span style="text-align:center;line-height:1.5">Make a Recap and keep the whole roll in the app.</span>
          <a class="badge" href="${APP_STORE}"><img src="/shots/app-store-badge.svg" alt="Download on the App Store" /></a>
          <span><a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></span>
        </div>
      </main>`;
    document.getElementById("more").addEventListener("click", loadAlbum);
    paintQueue();
    loadAlbum();
  }

  async function loadAlbum() {
    if (albumLoading || albumDone) return;
    albumLoading = true;
    const more = document.getElementById("more");
    try {
      const { status, json } = await api("/web/album", { token: G.token, body: { cursor: albumCursor, numItems: 30 } });
      if (isSessionEnd(status, json)) return endSession(json);
      if (!json.ok) {
        if (json.code === "not_revealed") { G.film.status = "active"; return renderCamera(); }
        document.getElementById("grid").outerHTML = `<p class="empty-album">${esc(json.error || "The album isn't available.")}</p>`;
        return;
      }
      albumCursor = json.continueCursor; albumDone = json.isDone;
      const grid = document.getElementById("grid"); if (!grid) return;
      const start = albumItems.length;
      albumItems.push(...json.page);
      grid.insertAdjacentHTML("beforeend", json.page.map((p, i) => `
        <button type="button" data-i="${start + i}" aria-label="${p.kind === "video" ? "Video" : "Photo"} by ${esc(p.authorName)}">
          <img src="${esc(p.thumbUrl || p.imageUrl || "")}" alt="" loading="lazy" decoding="async">
          ${p.kind === "video" ? `<span class="play">${playIcon}</span>` : ""}
          <span class="by">${esc(p.authorName)}</span>
        </button>`).join(""));
      grid.querySelectorAll("button:not([data-wired])").forEach(b => {
        b.dataset.wired = "1";
        b.addEventListener("click", () => openLightbox(+b.dataset.i, b));
        const img = b.querySelector("img"), show = () => img.classList.add("loaded");
        img.complete && img.naturalWidth ? show() : img.addEventListener("load", show, { once: true });
      });
      const authors = new Set(albumItems.map(p => p.authorName)).size;
      document.getElementById("albmeta").textContent = albumItems.length
        ? `${albumItems.length}${albumDone ? "" : "+"} ${albumItems.length === 1 ? "photo" : "photos"} · ${authors} ${authors === 1 ? "photographer" : "photographers"}`
        : "";
      if (!albumItems.length) grid.outerHTML = `<p class="empty-album">No photos on this roll yet.</p>`;
      if (more) more.hidden = albumDone;
    } catch (_) {
      toast("No connection. Pull to refresh when you're back online.");
    } finally { albumLoading = false; }
  }

  function openLightbox(i, opener) {
    const prev = document.querySelector(".lightbox"); if (prev) prev.remove();
    const lb = document.createElement("div");
    lb.className = "lightbox"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true");
    lb.setAttribute("aria-label", "Photo viewer");
    document.body.appendChild(lb);
    const show = n => {
      i = Math.max(0, Math.min(albumItems.length - 1, n));
      const p = albumItems[i];
      const media = p.kind === "video" && p.videoUrl
        ? `<video src="${esc(p.videoUrl)}" poster="${esc(p.imageUrl || "")}" controls playsinline></video>`
        : `<img src="${esc(p.imageUrl || p.thumbUrl || "")}" alt="Photo by ${esc(p.authorName)}">`;
      lb.innerHTML = `
        <div class="lb-top"><div class="lb-who"><b>${esc(p.authorName)}</b><span>${esc(new Date(p.capturedAt).toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}))}</span></div>
          <button class="round" type="button" data-x aria-label="Close">✕</button></div>
        <div class="lb-stage">${media}</div>
        <div class="lb-bot"><div class="lb-nav">
            <button class="round" type="button" data-prev aria-label="Previous" ${i === 0 ? "disabled" : ""}>‹</button>
            <button class="round" type="button" data-next aria-label="Next" ${i >= albumItems.length - 1 ? "disabled" : ""}>›</button></div>
          <button class="btn2" type="button" data-dl>Save ${p.kind === "video" ? "video" : "photo"}</button></div>`;
      lb.querySelector("[data-x]").onclick = close;
      lb.querySelector("[data-prev]").onclick = () => show(i - 1);
      lb.querySelector("[data-next]").onclick = () => { if (i >= albumItems.length - 2 && !albumDone) loadAlbum(); show(i + 1); };
      lb.querySelector("[data-dl]").onclick = () => save(p, i);
      lb.querySelector("[data-x]").focus();
    };
    const onKey = e => {
      if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") show(i - 1); else if (e.key === "ArrowRight") show(i + 1);
      else trapTab(e, lb);
    };
    let x0 = null;
    lb.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) show(i + (dx < 0 ? 1 : -1)); x0 = null; });
    function close() {
      lb.remove(); document.removeEventListener("keydown", onKey);
      const tile = document.querySelector(`#grid button[data-i="${i}"]`) || opener;
      if (tile && tile.focus) tile.focus();
    }
    document.addEventListener("keydown", onKey);
    show(i);
  }

  async function save(p, i) {
    const url = p.kind === "video" && p.videoUrl ? p.videoUrl : p.imageUrl;
    if (!url) return;
    const name = `filmsera-${(G.film.title || "film").replace(/[^a-z0-9]+/gi, "-").toLowerCase()}-${i + 1}.${p.kind === "video" ? "mov" : "jpg"}`;
    try {
      const r = await fetch(url, { mode: "cors", credentials: "omit" });
      if (!r.ok) throw new Error();
      const blob = await r.blob();
      const file = new File([blob], name, { type: blob.type || "image/jpeg" });
      if (isIOS && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === "AbortError") return; }
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    } catch (_) {
      window.open(url, "_blank", "noopener"); // fall back to the full-size file in a new tab
    }
  }

  // ---------------------------------------------------------------- boot

  /**
   * Invite preview through the rate-limited `/web/lookup` action (security
   * finding M3: the page no longer calls the public films:getByInviteCode).
   * Resolves the film, or null for an unknown code; throws on network / 429.
   */
  async function lookup(name) {
    const base = DEPLOYMENTS[name].site;
    const { status, json } = await api("/web/lookup", { body: { code }, base, timeout: 15000 });
    if (status === 404 && json && json.code === "not_found") return null;
    if (!json || !json.ok) throw new Error(json && json.code || "lookup failed");
    return json.film;
  }

  async function load(skipResume) {
    if (!code) return renderLost();
    // A guest who already joined on this device resumes straight into their film.
    const s = !skipResume && session.get();
    if (s && await resume(s)) return;
    if (injected && injected.film) {
      filmBackend = injected.backend || "prod";
      render(injected.film);
      // The Worker's copy may be a minute old and lacks hostOnly/full: refresh it.
      lookup(filmBackend).then(f => { if (f && mode === null) render(f); }).catch(() => {});
      return;
    }
    const order = explicitBackend ? [explicitBackend] : ["prod", "dev"];
    let failures = 0;
    for (const name of order) {
      try { const f = await lookup(name); if (f) { filmBackend = name; return render(f); } }
      catch (_) { failures++; }
    }
    renderLost(failures === order.length);
  }
  load();
})();
</script>
</body>
