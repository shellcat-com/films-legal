<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You're invited · Filmsera</title>
<!-- The invite Worker (worker/) rewrites the title, description, canonical and
     og:/twitter: tags with the film's own title, host and share card, and
     injects a JSON <script id="invite-data"> so the page paints without a round trip. Without
     the Worker the page still works: it looks the code up itself. -->
<link rel="canonical" href="https://getfilmsera.cam/join/" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-itunes-app" content="app-id=6781880091, app-argument=https://getfilmsera.cam/join/" id="smartBanner" />
<meta name="description" content="You've been invited to shoot a shared Film on Filmsera. Everyone's photos stay hidden until the reveal." />
<meta property="og:site_name" content="Filmsera" />
<meta property="og:type" content="website" />
<meta property="og:title" content="You're invited · Filmsera" />
<meta property="og:description" content="Join the Film, shoot your shots, and see everyone's photos at the reveal." />
<meta property="og:url" content="https://getfilmsera.cam/join/" />
<meta property="og:image" content="https://getfilmsera.cam/shots/filmsera-social.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="A Filmsera invitation" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="You're invited · Filmsera" />
<meta name="twitter:description" content="Join the Film, shoot your shots, and see everyone's photos at the reveal." />
<meta name="twitter:image" content="https://getfilmsera.cam/shots/filmsera-social.png" />
<meta name="theme-color" content="#0A0807" />
<meta name="robots" content="noindex" />
<!-- CSP (security L7). script-src allows only same-origin files and the one inline
     script below by hash: after editing that script, run `node scripts/csp-hash.mjs`.
     The invite Worker passes data in a non-executable application/json block. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-HsMN/+o3fMmspB1YfvcPYee+7n3/ZYbMvvz3W8i/G38='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://elated-gopher-868.convex.site https://elated-gopher-868.convex.cloud https://resilient-goat-339.convex.site https://resilient-goat-339.convex.cloud https://media.getfilmsera.cam; base-uri 'none'; form-action 'self'; object-src 'none'" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0A0807; --surface:#16120E; --surface-2:#1E1913; --brass:#E6B450; --brass-hi:#F2CB74; --brass-deep:#1A1206;
    --cream:#F4ECDD; --muted:#A89C88; --dim:#6F6556; --hair:rgba(245,232,210,.10); --hair-2:rgba(245,232,210,.16);
    --display:"Instrument Serif",Georgia,serif;
    --body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"Space Mono",ui-monospace,Menlo,monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--bg);-webkit-text-size-adjust:100%;}
  body{font-family:var(--body);color:var(--cream);min-height:100svh;background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  a{color:inherit;}

  /* Film grain over everything — the one texture the app uses too. */
  .grain{position:fixed;inset:-50%;pointer-events:none;z-index:50;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain 1.2s steps(4) infinite;}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(0,0)}}

  .mark{width:26px;height:19px;display:inline-block;flex:none;background:var(--brass);
    -webkit-mask:url(/brand/filmsera-mark.svg) center/contain no-repeat;mask:url(/brand/filmsera-mark.svg) center/contain no-repeat;}
  .wordmark{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);font-size:24px;letter-spacing:.2px;text-decoration:none;color:var(--cream);}
  .eyebrow{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;color:var(--muted);}

  /* ---------- The invitation (the same card on phone and inside the desktop mock-up) ---------- */
  .invite{position:relative;display:flex;flex-direction:column;min-height:100svh;background:var(--bg);overflow:hidden;isolation:isolate;}
  .cover{position:absolute;inset:0 0 auto 0;height:64%;z-index:-1;overflow:hidden;background:#120E0A;}
  .cover img{width:100%;height:100%;object-fit:cover;transform-origin:50% 40%;opacity:0;
    transition:opacity 1.1s var(--ease);animation:kenburns 22s ease-in-out infinite alternate;}
  .cover img.loaded{opacity:1;}
  @keyframes kenburns{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
  .cover::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,8,7,.55) 0%,rgba(10,8,7,0) 22%,rgba(10,8,7,.08) 50%,rgba(10,8,7,.82) 82%,var(--bg) 100%);}
  .cover.empty{background:radial-gradient(90% 70% at 70% 15%,rgba(230,180,80,.28),transparent 60%),radial-gradient(70% 60% at 10% 60%,rgba(190,90,50,.22),transparent 65%),#120E0A;}
  /* Light leak, slow and faint. */
  .leak{position:absolute;inset:0;z-index:-1;pointer-events:none;mix-blend-mode:screen;opacity:.55;
    background:radial-gradient(40% 30% at 100% 8%,rgba(255,140,60,.35),transparent 70%);animation:leak 9s ease-in-out infinite alternate;}
  @keyframes leak{from{opacity:.25}to{opacity:.6}}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 22px 0;}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
    background:rgba(10,8,7,.45);border:1px solid var(--hair-2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--cream);}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--brass);box-shadow:0 0 10px var(--brass);animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.35}}

  .sheet{margin-top:auto;padding:0 24px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;}
  .sheet{text-shadow:0 1px 18px rgba(0,0,0,.45);}
  .host{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:500;color:var(--cream);opacity:.92;}
  .avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700;color:var(--brass-deep);
    background:linear-gradient(135deg,var(--brass-hi),var(--brass));box-shadow:0 0 0 2px rgba(10,8,7,.6);}
  h1.title{font-family:var(--display);font-weight:400;font-size:clamp(46px,13vw,64px);line-height:.98;letter-spacing:-.6px;margin-top:10px;text-wrap:balance;}
  .meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:12px;letter-spacing:.2px;}
  .meta b{color:var(--cream);font-weight:400;}

  /* Develop countdown — mono digits in little frames, like a dial readout. */
  .develop{margin-top:20px;display:grid;gap:10px;padding:13px 14px 14px;border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid var(--hair);}
  .develop .label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;white-space:nowrap;font-family:var(--mono);font-size:10px;letter-spacing:2.2px;color:var(--muted);text-transform:uppercase;}
  .develop .label strong{color:var(--cream);font-family:var(--body);font-size:13px;letter-spacing:0;text-transform:none;font-weight:600;}
  .clock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .unit{text-align:center;padding:8px 0 6px;border-radius:11px;background:#0E0B08;border:1px solid var(--hair);}
  .unit b{display:block;font-family:var(--mono);font-size:21px;font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums;line-height:1.1;}
  .unit i{display:block;font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:1.4px;color:var(--dim);margin-top:2px;}

  .spots{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--muted);}
  .frames{display:flex;gap:4px;}
  .frames span{width:9px;height:13px;border-radius:2px;border:1px solid var(--hair-2);}
  .frames span.on{background:var(--brass);border-color:var(--brass);}

  .cta{margin-top:22px;position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px 24px;border-radius:999px;
    font-family:var(--mono);font-weight:700;font-size:15.5px;letter-spacing:.2px;color:var(--brass-deep);text-decoration:none;overflow:hidden;
    background:linear-gradient(180deg,var(--brass-hi),var(--brass));box-shadow:0 18px 40px -12px rgba(230,180,80,.55),inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .18s var(--ease),box-shadow .18s var(--ease);}
  .cta:active{transform:scale(.98);}
  .cta::after{content:"";position:absolute;inset:0;transform:translateX(-120%);
    background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);animation:sheen 4.5s ease-in-out 1.4s infinite;}
  @keyframes sheen{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
  .cta svg{width:18px;height:18px;}
  .fine{text-align:center;font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5;}

  .code{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 16px;border-radius:16px;border:1px dashed var(--hair-2);}
  .code .k{font-family:var(--mono);font-size:10px;letter-spacing:2.2px;color:var(--muted);}
  .code .v{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:5px;color:var(--cream);margin-top:1px;}
  .copy{padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--hair);font-size:13px;font-weight:600;white-space:nowrap;transition:background .2s;}
  .copy.done{color:var(--brass);}

  /* How it works — three quiet steps under the fold. */
  .how{padding:34px 24px calc(40px + env(safe-area-inset-bottom));border-top:1px solid var(--hair);}
  .how h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:8px 0 18px;}
  .how h2 em{color:var(--brass);}
  .steps{list-style:none;display:grid;gap:10px;}
  .steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--hair);}
  .steps .n{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--brass);background:rgba(230,180,80,.1);border:1px solid rgba(230,180,80,.25);}
  .steps b{display:block;font-weight:600;font-size:15px;}
  .steps p{color:var(--muted);font-size:13.5px;line-height:1.45;margin-top:2px;}
  .footer{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:28px;color:var(--dim);font-size:12px;}
  .footer a{text-decoration:none;color:var(--muted);}
  .badge img{height:44px;display:block;}

  /* Entrance choreography. */
  .rise{opacity:0;transform:translateY(14px);animation:rise .9s var(--ease) forwards;}
  @keyframes rise{to{opacity:1;transform:none}}

  /* ---------- Desktop: invitation in a phone + scan-to-join ---------- */
  .desk{display:none;}
  @media (min-width:900px){
    body{display:grid;place-items:center;padding:48px;
      background:radial-gradient(70% 60% at 30% 40%,rgba(230,180,80,.08),transparent 70%),radial-gradient(60% 60% at 90% 100%,rgba(190,90,50,.07),transparent 70%),var(--bg);}
    .stage{display:grid;grid-template-columns:auto 420px;gap:88px;align-items:center;max-width:1120px;}
    .phone{position:relative;width:372px;height:780px;border-radius:58px;padding:12px;
      background:linear-gradient(145deg,#2a241d,#0d0b09 40%,#1d1914);box-shadow:0 0 0 1px rgba(255,255,255,.07),0 60px 120px -30px rgba(0,0,0,.9),0 30px 80px -40px rgba(230,180,80,.25);}
    .phone::before{content:"";position:absolute;top:24px;left:50%;transform:translateX(-50%);width:110px;height:32px;border-radius:20px;background:#000;z-index:5;}
    .screen{width:100%;height:100%;border-radius:47px;overflow:hidden;position:relative;}
    .screen .invite{min-height:100%;height:100%;}
    .screen .topbar{padding-top:62px;}
    .screen .how{display:none;}
    .screen h1.title{font-size:50px;}
    .screen .unit b{font-size:19px;}
    .desk{display:block;}
    .desk .wordmark{margin-bottom:44px;}
    .desk h2{font-family:var(--display);font-weight:400;font-size:64px;line-height:.98;letter-spacing:-.8px;margin-top:14px;text-wrap:balance;}
    .desk .lead{color:var(--muted);font-size:17px;line-height:1.55;margin-top:16px;max-width:400px;}
    .scan{display:flex;gap:20px;align-items:center;margin-top:34px;padding:18px;border-radius:24px;background:var(--surface);border:1px solid var(--hair);}
    .qr{width:132px;height:132px;flex:none;padding:10px;border-radius:16px;background:#F4ECDD;}
    .qr svg{width:100%;height:100%;display:block;}
    .scan b{display:block;font-size:17px;font-weight:600;}
    .scan p{color:var(--muted);font-size:14px;line-height:1.5;margin-top:6px;}
    .desk .row{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap;}
    .desk .code{margin-top:0;flex:1;min-width:220px;}
  }

  /* ---------- Not found ---------- */
  .lost{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 26px;gap:0;}
  .lost .print{width:132px;height:160px;border-radius:6px;background:#F4ECDD;padding:9px 9px 30px;transform:rotate(-4deg);box-shadow:0 22px 50px rgba(0,0,0,.55);margin-bottom:34px;}
  .lost .print div{width:100%;height:100%;border-radius:2px;background:linear-gradient(160deg,#2a2017,#0d0a07);display:grid;place-items:center;}
  .lost .print .mark{width:40px;height:29px;opacity:.5;}
  .lost h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,10vw,52px);line-height:1;}
  .lost p{color:var(--muted);font-size:16px;line-height:1.5;margin-top:12px;max-width:360px;}
  .lost form{display:flex;gap:8px;margin-top:28px;width:100%;max-width:380px;}
  .lost input{flex:1;min-width:0;padding:16px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--hair-2);color:var(--cream);
    font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:4px;text-transform:uppercase;outline:none;}
  .lost input:focus{border-color:var(--brass);}
  .lost input::placeholder{color:var(--dim);letter-spacing:2px;font-weight:400;}
  .lost form .cta{margin:0;width:auto;padding:16px 22px;}
  .lost .alt{margin-top:22px;font-size:14px;color:var(--muted);}
  .lost .alt a{color:var(--brass);text-decoration:none;}
  .loading{min-height:100svh;display:grid;place-items:center;}
  .loading .mark{width:44px;height:32px;animation:pulse 1.4s ease-in-out infinite;}


  /* ---------- Web join: the app's film camera, name sheet, album ----------
     Tokens mirror the iOS app (Theme.swift / Kit/CameraChrome.swift):
     graphite = white 16 %, preview radius 28, deck tiles 74×62 r18, shutter 78,
     action column 44, record red, surfaces #1C1813, hairline cream 8 %. */
  :root{--graphite:#292929;--elev:#1C1813;--deep:#070605;--record:#E6261F;--hairline:rgba(245,232,210,.08);
    --spring:cubic-bezier(.3,1.35,.5,1);}
  .sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  .sr > *{display:block;}
  .alts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .btn2{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:999px;text-decoration:none;text-align:center;
    font-size:14px;font-weight:600;color:var(--cream);background:var(--graphite);border:1px solid var(--hairline);transition:transform .2s var(--spring);}
  .btn2:active{transform:scale(.97);}
  .btn2 svg{width:18px;height:18px;}

  /* Sheets (name, invite QR) — an iOS sheet: grabber, elevated warm surface. */
  .modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);animation:fade .25s var(--ease);}
  @keyframes fade{from{opacity:0}}
  .panel{position:relative;width:100%;max-width:480px;padding:30px 22px calc(24px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--elev);
    border:1px solid var(--hairline);border-bottom:0;box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:up .42s var(--spring);}
  .panel::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:rgba(244,236,221,.22);}
  @keyframes up{from{transform:translateY(60px);opacity:.3}}
  @media (min-width:900px){.modal{align-items:center}.panel{border-radius:28px;border-bottom:1px solid var(--hairline);}.panel::before{display:none}}
  .panel h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;margin-top:8px;}
  .panel p.sub{color:var(--muted);font-size:15px;line-height:1.45;margin-top:8px;}
  .field{width:100%;margin-top:22px;padding:14px;border-radius:13px;background:var(--elev);border:1px solid var(--hair-2);color:var(--cream);font:400 16px var(--body);outline:none;}
  .modal .panel{background:#14110D;}
  .field:focus-visible{outline:none;}
  .field:focus{border-color:var(--brass);}
  .err{min-height:20px;margin-top:10px;font-size:13.5px;color:#F08A6A;}
  .panel .cta,.album .recap{margin-top:6px;padding:14px 24px;background:var(--brass);box-shadow:none;font-family:var(--body);font-size:16px;font-weight:700;letter-spacing:0;}
  .panel .cta::after,.album .recap::after{display:none;}
  .panel .cta[disabled]{opacity:.6;}
  .panel .fine a{color:var(--cream);}
  .linkbtn{display:block;margin:14px auto 0;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;}
  .qrsheet{text-align:center;}
  .qrsheet .qr{width:212px;height:212px;margin:20px auto 0;padding:14px;border-radius:22px;background:var(--cream);}
  .qrsheet .qr svg{width:100%;height:100%;display:block;}
  .qrsheet .code{margin-top:18px;text-align:left;}

  /* ---- The camera screen (FilmCameraView) ---- */
  .guest{width:100%;margin:0 auto;}
  .cam{position:relative;display:flex;flex-direction:column;height:100svh;min-height:560px;background:var(--bg);overflow:hidden;
    padding:env(safe-area-inset-top) 0 calc(14px + env(safe-area-inset-bottom));}
  .g-top{display:flex;align-items:center;gap:8px;padding:4px 14px 0;}
  .hdr-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;color:var(--cream);text-decoration:none;transition:transform .2s var(--spring);}
  .hdr-btn:active{transform:scale(.92);}
  .hdr-btn svg{width:20px;height:20px;}
  .hdr-btn.tile-btn{background:var(--graphite);}
  .hdr-btn.tile-btn svg{width:18px;height:18px;}
  .hdr-btn .mark{width:24px;height:18px;}
  .g-head{flex:1;min-width:0;text-align:center;}
  .g-title{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .g-sub{margin-top:2px;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
  .g-sub .chip{display:inline;padding:0;border:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;font:inherit;letter-spacing:0;text-transform:none;color:inherit;}

  /* Viewfinder card: shaped to the look's output aspect, as big as the space allows. */
  .vf-wrap{flex:1;min-height:0;margin:14px 16px 0;container-type:size;display:grid;place-items:start center;}
  .vf{position:relative;width:min(100cqw,100cqh * var(--ar,.75));aspect-ratio:var(--ar,.75);border-radius:28px;overflow:hidden;background:var(--deep);
    -webkit-mask-image:-webkit-radial-gradient(white,black);touch-action:pan-y;}
  .vf video,.vf canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .vf video.mirror{transform:scaleX(-1);}

      const parts = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
      c.querySelectorAll("b").forEach((b, i) => { const v = String(parts[i]).padStart(2, "0"); if (b.textContent !== v) b.textContent = v; });

    });
    tick(); clockTimer = setInterval(tick, 1000);

  let layoutListener = null;
  const mq = window.matchMedia("(min-width:900px)");

    stopLayout();

  function stopLayout() {
    if (!layoutListener) return;
    mq.removeEventListener ? mq.removeEventListener("change", layoutListener) : mq.removeListener(layoutListener);
    layoutListener = null;

  /** state: falsy = unknown code, "offline", "rate" (429, N2) or "busy" (503). */
  function renderLost(state) {
    stopLayout();

        <p class="rise" style="animation-delay:.16s">${limited

  /** kind "ok" = the app's brass confirmation capsule. */
  function toast(msg, ms = 4200, kind) {
    document.querySelectorAll(".toast").forEach(t => { if (t.textContent === msg) t.remove(); });
    const el = document.createElement("div");
    el.className = kind === "ok" ? "toast ok" : "toast"; el.setAttribute("role", "status"); el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), ms);
  }

  // ---------------------------------------------------------------- web API

  /**
   * POST to a /web/* endpoint. Resolves {status, json}; rejects on network
   * failure or after `timeout` ms (the request is aborted — finding F2).
   */
  async function api(path, { body, token, raw, type, timeout = 20000, base = API } = {}) {
    const headers = {};
    if (token) headers.Authorization = `Bearer ${token}`;
    let payload;
    if (raw) { payload = raw; headers["Content-Type"] = type || "image/jpeg"; }
    else { payload = JSON.stringify(body || {}); headers["Content-Type"] = "application/json"; }
    const url = path.startsWith("http") ? path : `${base}${path}`;
    if (!url.startsWith(`${base}/web/`)) throw new Error("Unexpected upload URL");
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeout);
    try {
      const r = await fetch(url, { method: "POST", headers, body: payload, mode: "cors", credentials: "omit", signal: ctl.signal });
      let json = null;
      try { json = await r.json(); } catch (_) {
        if (ctl.signal.aborted) throw new Error("timeout");
        json = { ok: false, code: "bad_response", error: "Something went wrong." };
      }
      return { status: r.status, json };
    } finally { clearTimeout(timer); }
  }

  // Session per deployment + code, so reloading resumes as the same guest.
  const SKEY = `filmsera.webjoin.${WEB}.${code}`;
  const session = {
    get() { try { const s = JSON.parse(localStorage.getItem(SKEY) || "null"); return s && typeof s.token === "string" ? s : null; } catch (_) { return null; } },
    set(s) { try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (_) {} },
    clear() { try { localStorage.removeItem(SKEY); } catch (_) {} },
  };

  // ---------------------------------------------------------------- join sheet

  function openJoinSheet(f) {
    const prev = document.querySelector(".modal"); if (prev) prev.remove();
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `
      <form class="panel" role="dialog" aria-modal="true" aria-labelledby="jn-h" novalidate>
        <div class="eyebrow">${esc(f.title)}</div>
        <h2 id="jn-h">What should we call you?</h2>
        <p class="sub">Your name goes on your photos when the film develops.</p>
        <input class="field" name="name" maxlength="40" autocomplete="nickname" placeholder="Your name" aria-label="Your name" required />
        <div class="err" role="alert"></div>
        <button class="cta" type="submit">Join ${arrow}</button>
        <p class="fine">No account needed. By joining you agree to the <a href="/terms.html" target="_blank" rel="noopener">Terms</a> and <a href="/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</p>
        <button class="linkbtn" type="button" data-close>Not now</button>
      </form>`;
    const active = document.activeElement;
    const opener = active && active.matches && active.matches("[data-webjoin]") ? active : app.querySelector("[data-webjoin]");
    document.body.appendChild(m); setInert(true);
    const form = m.querySelector("form"), input = form.name, err = form.querySelector(".err"), btn = form.querySelector(".cta");
    const close = (restore = true) => {
      m.remove(); setInert(false); document.removeEventListener("keydown", onKey);
      if (restore && opener && opener.isConnected && opener.focus) opener.focus();
    };
    const onKey = e => { if (e.key === "Escape") close(); else trapTab(e, form); };
    document.addEventListener("keydown", onKey);
    m.addEventListener("click", e => { if (e.target === m) close(); });
    m.querySelector("[data-close]").addEventListener("click", close);
    setTimeout(() => input.focus(), 50);
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const name = input.value.replace(/\s+/g, " ").trim();
      if (!name) { err.textContent = "Type your name to join."; input.focus(); return; }
      if (name.length > 40) { err.textContent = "Keep your name under 40 characters."; return; }
      err.textContent = ""; btn.disabled = true;
      try {
        // A 503 "busy" (many guests joining at once on one network) is retried quietly.
        let res;
        for (let attempt = 0; ; attempt++) {
          res = await api("/web/join", { body: { code, name } });
          // 503 busy, or the platform's own 500 under burst load (FR1): retry quietly.
          if ((res.status !== 503 && res.status !== 500) || attempt >= 3) break;
          await new Promise(r => setTimeout(r, 600 * (attempt + 1) + Math.random() * 600));
        }
        const { json } = res;
        if (!json.ok) { err.textContent = json.error || "Couldn't join. Try again."; btn.disabled = false; return; }
        session.set({ token: json.token, name: json.name, joinedAt: Date.now() });
        G.token = json.token;
        close(false);
        startGuest(json);
      } catch (_) {
        err.textContent = "No connection. Check your signal and try again."; btn.disabled = false;
      }
    });
  }

  /** Keep Tab / Shift+Tab inside a dialog (F11). */
  function trapTab(e, root) {
    if (e.key !== "Tab") return;
    const els = [...root.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),video[controls],[tabindex]:not([tabindex="-1"])')]
      .filter(el => el.offsetParent !== null || el === document.activeElement);
    if (!els.length) return;
    // Always move focus ourselves: Safari's default Tab skips buttons and links,
    // so leaving it to the browser lets focus escape behind the dialog (QA F1).
    e.preventDefault();
    const n = els.length, i = els.indexOf(document.activeElement);
    els[i < 0 ? (e.shiftKey ? n - 1 : 0) : (i + (e.shiftKey ? -1 : 1) + n) % n].focus();
  }
  /** Keep the page behind a dialog out of reach (Tab, VoiceOver) while it's open. */
  const setInert = on => { try { app.inert = on; if (on) app.setAttribute("aria-hidden", "true"); else app.removeAttribute("aria-hidden"); } catch (_) {} };

  // ---------------------------------------------------------------- pending shots (IndexedDB)

  // Every shot is saved on the device before it uploads, and only removed once
  // the server has committed it — so a dropped connection never loses a frame.
  // Bytes are stored as ArrayBuffers (WebKit private mode can't store Blobs).
  // If the browser can't persist at all, `put` reports it and the page says
  // "keep this page open" instead of claiming the shot is saved (F3).
  const store = (() => {
    const mem = new Map();
    let dbp = null;
    function db() {
      if (!("indexedDB" in window)) return Promise.reject(new Error("no idb"));
      if (!dbp) dbp = new Promise((res, rej) => {
        const r = indexedDB.open("filmsera-webjoin", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("pending", { keyPath: "id" });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      return dbp;
    }
    const tx = (mode, fn) => db().then(d => new Promise((res, rej) => {
      const t = d.transaction("pending", mode); const os = t.objectStore("pending");
      const out = fn(os);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      t.onerror = () => rej(t.error);
    }));
    return {
      async put(item) {
        mem.set(item.id, item);
        try { await tx("readwrite", os => os.put(item)); item.persisted = true; } catch (_) { item.persisted = false; }
        return item.persisted;
      },
      async del(id) { mem.delete(id); try { await tx("readwrite", os => os.delete(id)); } catch (_) {} },
      async list() {
        try {
          const all = await tx("readonly", os => os.getAll());
          for (const it of all || []) if (!mem.has(it.id)) mem.set(it.id, { ...it, persisted: true });
        } catch (_) {}
        return [...mem.values()].filter(it => it.skey === SKEY).sort((a, b) => a.capturedAt - b.capturedAt);
      },
    };
  })();

  // ---------------------------------------------------------------- image pipeline

  const FULL_EDGE = 2560, THUMB_EDGE = 480;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // The film's Look, as in the app. Colour + tone: the app's own 33³ cube per
  // camera (assets/looks/<presetID>.png, built from FilmLook/FilmLookLibrary by
  // scripts/looks/build.sh, sRGB primaries). Vignette and grain numbers come
  // from LookStageLibrary; aspect, shutter sound and haptic from CameraPreset.

  /** The invite sheet behind the QR button (the app's InviteSheet): code, QR, copy. */

      <div class="panel qrsheet" role="dialog" aria-modal="true" aria-labelledby="iv-h">

    });

      const n = q.getModuleCount(); let d = "";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
      m.querySelector("#ivqr").innerHTML = `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-hidden="true"><path d="${d}" fill="#0A0807"/></svg>`;
      return true;

    setTimeout(() => m.querySelector("[data-close]").focus(), 50);
  }

  /** Rolling frame counter (FrameCounterTile): the number large, its neighbours ghosted and clipped. */
  function paintRoll(el, value, text, spoken) {
    let track = el.querySelector(".track"), label = el.querySelector(".sr");
    if (!track) {
      el.innerHTML = `<div class="track" aria-hidden="true"></div><span class="sr"></span>`;
      track = el.querySelector(".track"); label = el.querySelector(".sr");
      el.setAttribute("role", "img");
    }
    label.innerHTML = text;
    el.setAttribute("aria-label", spoken);
    const prev = el.dataset.v === undefined ? null : +el.dataset.v;
    if (prev === value) return;
    track.innerHTML = [value - 1, value, value + 1] // the app shows one neighbour each side
      .map((n, i) => `<span class="${i === 1 ? "cur" : ""}">${n >= 0 ? n : "\u2007"}</span>`).join("");
    const centre = i => { const c = track.children[i]; return c.offsetLeft + c.offsetWidth / 2; };
    const place = () => { track.style.left = `${el.clientWidth / 2 - centre(1)}px`; };
    place();
    if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(place);
    if (prev !== null && !reduced) {
      const dir = Math.sign(value - prev); // the old number sits one step that way in the new strip
      track.style.transition = "none"; track.style.transform = `translateX(${centre(1) - centre(1 - dir)}px)`;
      void track.offsetWidth;
      track.style.transition = ""; track.style.transform = "";
    }
    el.dataset.v = value;
  }

  let rollWasOpen = false;
  function paintCounter() {
    const el = document.getElementById("count"); if (!el) return;
    const left = effectiveLeft();
    const total = G.film.shotsPerPerson > 0 ? G.film.shotsPerPerson : null;
    const taken = G.shotsUsed + G.pending;
    paintRoll(el, left === null ? taken : left, left === null
      ? `<b>${String(taken).padStart(2, "0")}</b><span>shots taken</span>`
      : `<b>${String(left).padStart(2, "0")}</b><span>${left === 1 ? "shot" : "shots"} left</span>`,
      left === null ? `${taken} ${taken === 1 ? "shot" : "shots"} taken` : `${left} ${left === 1 ? "shot" : "shots"} left`);
    const shutter = document.getElementById("shutter");
    const done = (left === 0) || !G.canShoot;
    if (shutter) { shutter.disabled = done; shutter.setAttribute("aria-label", done ? "No shots left" : (left === null ? "Take a photo for this film" : `Take a photo, ${left} ${left === 1 ? "shot" : "shots"} left`)); }
    const negs = document.getElementById("negs");
    if (negs) {
      const n = Math.min(taken, 60), have = negs.children.length;
      if (have !== n) negs.innerHTML = Array.from({ length: n }, (_, i) =>
        `<span class="neg${i >= G.shotsUsed ? " pending" : ""}" style="background:radial-gradient(120% 90% at 35% 55%,${negColor(i)},#070605)"></span>`).join("");
      else [...negs.children].forEach((s, i) => s.classList.toggle("pending", i >= G.shotsUsed));
    }
    const note = document.getElementById("rollnote");
    if (note) note.textContent = taken === 0
      ? (total ? `${total} shots on your roll. Nobody sees them, you included, until the film develops.` : "Nobody sees your shots, you included, until the film develops.")
      : `${taken} ${taken === 1 ? "shot" : "shots"} in ${G.film.title}${total ? ` · ${Math.max(0, total - taken)} left` : ""}. Photos stay hidden until the reveal.`;
    const tile = document.getElementById("sealedTile");
    if (tile) tile.setAttribute("aria-label", `Your roll, ${taken} ${taken === 1 ? "shot" : "shots"}, hidden until the reveal`);
    const cam = document.getElementById("cam");
    if (cam) cam.classList.toggle("done", !!done);
    if (!done && left !== 0) rollWasOpen = true;
    if (done && left === 0) {
      const msg = document.getElementById("vfmsg");
      stopCamera();
      if (msg) {
        if (rollWasOpen && !msg.classList.contains("done")) { sound("roll_finished"); haptic("instant"); }
        rollWasOpen = false;
        msg.style.display = "flex"; msg.classList.add("done");
        const n = G.shotsUsed + G.pending;
        msg.innerHTML = `<span class="mark"></span><h2>You're out of shots</h2><p>${n} ${n === 1 ? "shot" : "shots"} in ${esc(G.film.title)}.<br>Photos stay hidden until reveal.</p><button class="pill" type="button" data-details>See when it develops</button>`;
        msg.querySelector("[data-details]").addEventListener("click", () => document.getElementById("info").click());
      }
    }
  }

  let unsaved = 0; // pending shots this browser could NOT persist (memory only)
  const keepOpen = n => n === 1
    ? "We can't keep this shot if you close the page — keep it open until it uploads."
    : "We can't keep these shots if you close the page — keep it open until they upload.";
  function paintQueue(state) {
    const q = document.getElementById("queue"); if (!q) return;
    const warn = state === "offline" || unsaved > 0;
    q.classList.toggle("warn", warn);
    const tile = document.getElementById("sealedTile");
    if (tile) { tile.classList.toggle("busy", G.pending > 0 && !warn); tile.classList.toggle("warn", G.pending > 0 && warn); }
    const set = (text, ok) => {
      if (q.textContent !== text) { q.textContent = text; q.classList.remove("ok"); if (ok) { void q.offsetWidth; q.classList.add("ok"); } }
    };
    if (G.pending === 0) { set(G.shotsUsed && mode === "camera" ? "All shots saved ✓" : "", true); return; }
    const n = G.pending, shots = n === 1 ? "shot" : "shots";
    if (unsaved > 0) {
      set(state === "offline"
        ? `Waiting for a connection. ${keepOpen(n)}`
        : `Uploading ${n} ${shots}… ${keepOpen(n)}`);
      return;
    }
    set(state === "offline"
      ? `${n} ${n === 1 ? "shot is" : "shots are"} saved on this phone — will upload when you're back online`
      : `Saving ${n} ${shots}…`);
  }
  // Warn before leaving while a shot exists only in memory.
  window.addEventListener("beforeunload", e => { if (unsaved > 0) { e.preventDefault(); e.returnValue = ""; } });

  // ---- Live viewfinder through the film's look (WebGL), torch, zoom.
  let vfR = null, vfRaf = 0, vfVideoCb = 0, torchOn = false, zoomNow = 1, track = null;
  function stopViewfinder() {
    cancelAnimationFrame(vfRaf); vfRaf = 0;
    const v = document.getElementById("video");
    if (vfVideoCb && v && v.cancelVideoFrameCallback) v.cancelVideoFrameCallback(vfVideoCb);
    vfVideoCb = 0;
  }
  async function startViewfinder(v) {
    stopViewfinder();
    const vf = document.getElementById("vf"), canvas = document.getElementById("vfgl");
    if (!vf || !canvas) return;
    if (!vfR || vfR.canvas !== canvas || vfR.r.lost) { const r = makeRenderer(canvas, false); vfR = r ? { r, canvas } : null; }
    if (!vfR) { vf.classList.remove("gl"); return; }
    const id = lookIdOf(G.film), look = LOOKS[id];
    try { vfR.r.setLut(id, await withTimeout(loadLut(id), 6000)); } catch (_) { vf.classList.remove("gl"); return; }
    let last = 0;
    const frame = now => {
      if (mode !== "camera" || !stream || !v.videoWidth) { vf.classList.remove("gl"); return; }
      if (now - last > 30) { // ≤ ~30 fps keeps phones cool
        last = now;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        let w = Math.round(vf.clientWidth * dpr), h = Math.round(vf.clientHeight * dpr);
        const k = Math.min(1, 1280 / Math.max(w, h, 1)); w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
        try { vfR.r.draw(v, w, h, coverCrop(v.videoWidth, v.videoHeight, w / h), look, facing === "user"); vf.classList.add("gl"); }
        catch (_) { vf.classList.remove("gl"); return; }
      }
      if (v.requestVideoFrameCallback) vfVideoCb = v.requestVideoFrameCallback(frame);
      else vfRaf = requestAnimationFrame(frame);
    };
    if (v.requestVideoFrameCallback) vfVideoCb = v.requestVideoFrameCallback(frame); else vfRaf = requestAnimationFrame(frame);
  }

  /** Collapse the flash · zoom · flip row when this browser offers none of them. */
  function syncCtrl() {
    const row = document.querySelector(".ctrl"); if (!row) return;
    row.classList.toggle("empty", [...row.children].every(el => el.hidden));
  }

  function setupTrackControls() {
    const torchBtn = document.getElementById("torch"), zoomBox = document.getElementById("zoom");
    track = stream && stream.getVideoTracks()[0] || null;
    let caps = {};
    try { caps = track && track.getCapabilities ? track.getCapabilities() : {}; } catch (_) {}
    // Flash = the torch, only where the browser exposes it (Android Chrome, back camera).
    if (torchBtn) torchBtn.hidden = !caps.torch;
    if (!caps.torch) torchOn = false;
    // Zoom stops 1× / 2× (the app's), only where the track supports zoom.
    const z = caps.zoom;
    const stops = z && z.max >= 1.5 ? [1, 2].filter(s => s >= (z.min || 1) - 1e-6 && s <= z.max + 1e-6) : [];
    if (!zoomBox) return;
    zoomBox.hidden = stops.length < 2;
    zoomBox.dataset.max = z ? z.max : 1; zoomBox.dataset.min = z ? (z.min || 1) : 1;
    const paint = () => {
      const active = stops.filter(s => s <= zoomNow + 0.05).pop() || stops[0];
      zoomBox.innerHTML = stops.map(s => `<button type="button" data-z="${s}" aria-pressed="${s === active}" aria-label="Zoom ${s}×">${s === active ? `${zoomNow.toFixed(1)}×` : s}</button>`).join("");
      zoomBox.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { haptic("select"); setZoom(+b.dataset.z); }));
    };
    setZoom.paint = paint;
    if (stops.length >= 2) { if (zoomNow !== 1) setZoom(zoomNow); paint(); }
    syncCtrl();
  }
  async function setZoom(zv) {
    const box = document.getElementById("zoom");
    if (!track || !box || box.hidden) return;
    zoomNow = Math.min(+box.dataset.max, Math.max(+box.dataset.min, zv));
    try { await track.applyConstraints({ advanced: [{ zoom: zoomNow }] }); } catch (_) {}
    if (setZoom.paint) setZoom.paint();
  }

  function wireViewfinder(vf) {
    // Pinch to zoom (where zoom is supported) and tap to focus (where the track can).
    let pinch = null;
    vf.addEventListener("touchstart", e => {
      if (e.touches.length === 2) { const [a, b] = e.touches; pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: zoomNow }; }
    }, { passive: true });
    vf.addEventListener("touchmove", e => {
      if (!pinch || e.touches.length !== 2) return;
      const [a, b] = e.touches; setZoom(pinch.z * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pinch.d);
    }, { passive: true });
    vf.addEventListener("touchend", () => { pinch = null; }, { passive: true });
    vf.addEventListener("click", async e => {
      if (!track || e.target.closest(".msg")) return;
      let caps = {}; try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch (_) {}
      if (!caps.focusMode || !caps.focusMode.length) return;
      const r = vf.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      try {
        await track.applyConstraints({ advanced: [{ pointsOfInterest: [{ x: facing === "user" ? 1 - x : x, y }], focusMode: caps.focusMode.includes("single-shot") ? "single-shot" : "continuous" }] });
      } catch (_) { return; }
      haptic("digital");
      const ret = document.createElement("span"); ret.className = "reticle";
      ret.style.left = `${e.clientX - r.left}px`; ret.style.top = `${e.clientY - r.top}px`;
      vf.appendChild(ret); setTimeout(() => ret.remove(), 950);
    });
  }

  function stopCamera() {
    stopViewfinder(); track = null;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    const v = document.getElementById("video"); if (v) v.srcObject = null;
    const vf = document.getElementById("vf"); if (vf) vf.classList.remove("gl");
  }

  async function startCamera() {
    stopCamera();
    const msg = document.getElementById("vfmsg"), v = document.getElementById("video"), flip = document.getElementById("flip");
    if (!v || effectiveLeft() === 0) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext) return fallback("This browser can't show a live viewfinder.");
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false,
        // ~1920 long edge: every frame is uploaded to the GPU for the graded
        // viewfinder, and 2560×1920 (5 MP × 30 fps) is too heavy for mid-range phones.
        video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1440 } } });
      if (mode !== "camera") return stopCamera();
      v.srcObject = stream; v.classList.toggle("mirror", facing === "user");
      await v.play().catch(() => {});
      msg.style.display = "none";
      setupTrackControls();
      startViewfinder(v);
      try {
        const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
        flip.hidden = cams.length < 2;
      } catch (_) { flip.hidden = true; }
      syncCtrl();
    } catch (e) {
      fallback(e && e.name === "NotAllowedError" ? "Camera access is off for this page." : "The camera isn't available here.");
    }
    function fallback(why) {
      stream = null; flip.hidden = true; syncCtrl();
      msg.style.display = "flex";
      msg.innerHTML = `<span class="mark"></span><span>${esc(why)}<br>Tap the shutter to take a photo with your phone's camera.</span>`;
    }
  }

  /**
   * Tap = photo. A press held past 0.35 s is the app's "hold for video" — video
   * clips need the app, so the browser explains instead (no photo is taken).
   */
  function wireShutter(btn) {
    let holdTimer = null, held = false;
    const down = e => {
      if (btn.disabled || (e.button !== undefined && e.button !== 0)) return;
      held = false; btn.classList.add("down");
      const sn = `shutter_${lookOf(G.film).s}`; // load the sound on first touch so the click is instant
      if (!sounds[sn]) { try { sounds[sn] = new Audio(`/assets/sounds/${sn}.wav`); sounds[sn].preload = "auto"; sounds[sn].load(); } catch (_) {} }
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => { held = true; haptic("soft"); hint("Video clips need the Filmsera app"); }, 350);
    };
    const up = () => { clearTimeout(holdTimer); btn.classList.remove("down"); };
    btn.addEventListener("pointerdown", down);
    ["pointerup", "pointercancel", "pointerleave"].forEach(t => btn.addEventListener(t, up));
    btn.addEventListener("contextmenu", e => e.preventDefault());
    btn.addEventListener("click", () => {
      if (held) { held = false; return; }
      if (!btn.classList.contains("down") && !reduced) { btn.classList.add("down"); setTimeout(() => btn.classList.remove("down"), 120); }
      onShutter();
    });
  }

  function blink() {
    const fl = document.getElementById("flash"); if (!fl) return;
    fl.classList.remove("on"); void fl.offsetWidth; fl.classList.add("on");
  }

  let shooting = false;
  async function onShutter() {
    if (shooting || effectiveLeft() === 0) return;
    const v = document.getElementById("video");
    if (!stream || !v || !v.videoWidth) { document.getElementById("file").click(); return; }
    shooting = true;
    const btn = document.getElementById("shutter"); btn.classList.add("busy");
    const look = lookOf(G.film);
    try {
      if (torchOn && track) { try { await track.applyConstraints({ advanced: [{ torch: true }] }); await new Promise(r => setTimeout(r, 280)); } catch (_) {} }
      blink(); sound(`shutter_${look.s}`); haptic(look.h);
      const vw = v.videoWidth, vh = v.videoHeight;
      const out = await develop(v, vw, vh, facing === "user", coverCrop(vw, vh, outAspect(look)));
      if (torchOn && track) { try { await track.applyConstraints({ advanced: [{ torch: false }] }); } catch (_) {} }
      await queueShot(out);
    } catch (_) { toast("That shot didn't take. Try again."); }
    finally { shooting = false; btn.classList.remove("busy"); }
  }

  async function onFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file || shooting || effectiveLeft() === 0) return;
    shooting = true;
    const btn = document.getElementById("shutter"); btn.classList.add("busy");
    try {
      let d;
      try { d = await decodeFile(file); } catch (_) {
        toast(await isHeic(file)
          ? "This photo format (HEIC) isn't supported in this browser. Take it with the camera button, or choose a JPEG."
          : "That photo couldn't be opened. Try a different photo.", 6000);
        return;
      }
      await queueShot(await develop(d.src, d.w, d.h, false));
      blink(); haptic(lookOf(G.film).h);
    } catch (_) {
      toast("That photo couldn't be saved. Try again.");
    } finally { shooting = false; btn.classList.remove("busy"); }
  }

  async function queueShot({ image, thumb }) {
    const item = { id: uuid(), skey: SKEY, image: await image.arrayBuffer(), thumb: await thumb.arrayBuffer(), capturedAt: Date.now() };
    await store.put(item);
    G.pending++;
    unsaved = (await store.list()).filter(it => it.persisted === false).length;
    const b = document.querySelector("#count b"); if (b) { b.classList.add("tick"); setTimeout(() => b.classList.remove("tick"), 300); }
    paintCounter(); paintQueue();
    pump();
  }

  // ---------------------------------------------------------------- upload queue

  const PERMANENT = new Set(["no_shots", "host_only", "ended", "bad_type", "too_large", "bad_request"]);
  let pumping = false, pumpSince = 0, retryTimer = null, backoff = 2000;
  const byteLen = b => (b && (b.byteLength ?? b.size)) || 0;

  /**
   * Upload + commit one shot. Idempotent per shot id (F4): the server hands back
   * the same tickets (with `filled`) or `committed: true` if a lost commit already
   * landed. Every request has a timeout (F2); uploads get time for slow links.
   */
  async function uploadOne(item) {
    for (let attempt = 0; attempt < 2; attempt++) {
      const { json: u } = await api("/web/upload-url", { token: G.token, body: { photoClientId: item.id } });
      if (!u.ok || u.committed) return u;
      let restart = false;
      for (const kind of ["image", "thumb"]) {
        if (u[kind].filled) continue;
        const up = await api(u[kind].uploadUrl, { token: G.token, raw: item[kind], type: "image/jpeg",
          timeout: 30000 + byteLen(item[kind]) / 25 }); // ≥ 25 KB/s
        if (up.json.ok || up.json.code === "ticket_used") continue;
        if (up.json.code === "ticket_expired" || up.json.code === "bad_ticket") { restart = true; break; }
        return up.json;
      }
      if (restart) continue;
      const { json: c } = await api("/web/commit", { token: G.token, body: {
        photoClientId: item.id, imageTicket: u.image.ticket, thumbTicket: u.thumb.ticket, capturedAt: item.capturedAt } });
      if (c.ok || !["bad_ticket", "not_uploaded", "ticket_expired"].includes(c.code)) return c;
    }
    return { ok: false, code: "retry" };
  }

  /**
   * Drain the queue. One pass at a time, but a pass that has been running for
   * over 3 minutes is treated as wedged and superseded, so the lock can't stick.
   * A shot that fails transiently doesn't stop later shots from trying.
   */
  async function pump() {
    if (!G.token) return;
    if (pumping && Date.now() - pumpSince < 180000) return;
    const pass = pumpSince = Date.now();
    pumping = true; clearTimeout(retryTimer);
    const retrying = backoff > 2000; // keep the "waiting for a connection" line while retrying
    try {
      for (let round = 0; round < 20; round++) {
        const items = await store.list();
        G.pending = items.length; unsaved = items.filter(it => it.persisted === false).length;
        paintCounter(); paintQueue(retrying && round === 0 ? "offline" : undefined);
        if (!items.length) { backoff = 2000; return; }
        let progressed = false, transient = false;
        for (const item of items) {
          if (pumpSince !== pass) return; // superseded by a newer pass
          let res;
          try { res = await uploadOne(item); } catch (_) { transient = true; continue; }
          if (res.ok) {
            await store.del(item.id); applyStatus(res); progressed = true;
          } else if (["bad_token", "removed", "expired"].includes(res.code)) {
            return endSession(res);
          } else if (PERMANENT.has(res.code)) {
            await store.del(item.id); progressed = true;
            toast(res.code === "no_shots" ? "Your roll was already used up, so this extra shot wasn't saved." : (res.error || "A shot couldn't be saved."));
          } else {
            transient = true; // rate limited, shots_pending, server hiccup, timeout
          }
          const left = await store.list();
          G.pending = left.length; unsaved = left.filter(it => it.persisted === false).length;
          paintCounter(); paintQueue(transient ? "offline" : undefined);
        }
        if (transient) { paintQueue("offline"); schedule(); return; }
        if (!progressed) return;
      }
    } finally { if (pumpSince === pass) pumping = false; }
  }
  function schedule() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(pump, backoff);
    backoff = Math.min(backoff * 2, 60000);
  }
  window.addEventListener("online", () => { backoff = 2000; pump(); });

  // ---------------------------------------------------------------- album view

  let albumItems = [], albumCursor = null, albumDone = false, albumLoading = false;

  function renderAlbum() {
    mode = "album"; stopCamera(); clearInterval(clockTimer);
    const f = G.film;
    document.title = `${f.title} · Developed · Filmsera`;
    albumItems = []; albumCursor = null; albumDone = false;
    app.innerHTML = `
      <main class="guest album">
        <div class="g-top"><a class="hdr-btn tile-btn" href="/" aria-label="Filmsera home"><span class="mark"></span></a><span class="chip"><span class="dot"></span>${esc(G.name)}</span></div>
        <div class="eyebrow eyebrow-in">The film is in</div>
        <h1 class="a-title">${esc(f.title)}</h1>
        <div class="stats" id="albmeta"></div>
        <div class="faces" id="faces" aria-hidden="true"></div>
        <a class="cta recap" href="${APP_STORE}">${ICON.recap} Make a recap in the app</a>
        <div class="grid" id="grid" aria-label="Photos"></div>
        <div class="queue" id="queue" aria-live="polite"></div>
        <button class="btn2 more" id="more" type="button" hidden>Load more</button>
        <div class="footer" style="margin-top:30px">
          <span style="text-align:center;line-height:1.5">Keep the whole roll, make a Recap and host your own film in the app.</span>
          <a class="badge" href="${APP_STORE}"><img src="/shots/app-store-badge.svg" alt="Download on the App Store" /></a>
          <span><a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></span>
        </div>
      </main>`;
    document.getElementById("more").addEventListener("click", loadAlbum);
    paintQueue();
    loadAlbum();
  }

  /** The film page's stat row (photos · developed · people) and the guests' initials. */
  function paintAlbumMeta() {
    const el = document.getElementById("albmeta"); if (!el) return;
    if (!albumItems.length) { el.innerHTML = ""; return; }
    const authors = [...new Set(albumItems.map(p => p.authorName))];
    const when = new Date(G.film.revealAt && G.film.revealAt <= Date.now() ? G.film.revealAt : Date.now());
    el.innerHTML = `<div><b>${albumItems.length}${albumDone ? "" : "+"}</b><span>${albumItems.length === 1 ? "Photo" : "Photos"}</span></div>
      <div><b>${esc(when.toLocaleDateString(undefined, { month: "short", day: "numeric" }))}</b><span>Developed</span></div>
      <div><b>${authors.length}</b><span>${authors.length === 1 ? "Person" : "People"}</span></div>`;
    const faces = document.getElementById("faces");
    if (faces) faces.innerHTML = authors.slice(0, 4).map((a, i) => `<span style="background:hsl(${Math.round(NEG_HUES[(i + 2) % NEG_HUES.length] * 360)} 28% 40%)">${esc(initials(a).slice(0, 2))}</span>`).join("")
      + (authors.length > 4 ? `<span class="more-faces">+${authors.length - 4}</span>` : "");
  }

  /**
   * A page that fails never wipes what's shown (FR2): tiles stay, a short note
   * appears, the page is retried with backoff (2, 4, 8 s) and "Load more" is
   * offered. Only a permanent refusal before anything loaded replaces the grid.
   */
  let albumRetry = null, albumTries = 0;
  function albumHiccup(message, retryable) {
    const more = document.getElementById("more");
    const q = document.getElementById("queue");
    if (q) { q.classList.add("warn"); q.textContent = message; }
    if (more) { more.hidden = false; more.textContent = albumItems.length ? "Load more" : "Try again"; }
    clearTimeout(albumRetry);
    if (retryable && albumTries < 3) {
      albumRetry = setTimeout(() => { albumTries++; loadAlbum(); }, 2000 * 2 ** albumTries);
    }
  }

  async function loadAlbum() {
    if (albumLoading || albumDone) return;
    albumLoading = true; clearTimeout(albumRetry);
    const more = document.getElementById("more");
    try {
      const { status, json } = await api("/web/album", { token: G.token, body: { cursor: albumCursor, numItems: 30 } });
      if (isSessionEnd(status, json)) return endSession(json);
      if (!json.ok) {
        if (json.code === "not_revealed") { G.film.status = "active"; return renderCamera(); }
        const transient = status >= 500 || status === 429 || status === 400 /* stale cursor */;
        // A cursor the server can't use: page again from the top; tiles already
        // shown are skipped below, so nothing disappears or repeats.
        if (status === 400) albumCursor = null;
        if (!transient && !albumItems.length) {
          const grid = document.getElementById("grid");
          if (grid) grid.outerHTML = `<p class="empty-album">${esc(json.error || "The album isn't available.")}</p>`;
          return;
        }
        albumHiccup(transient ? "Couldn't load more photos just now. Trying again…" : (json.error || "Couldn't load more photos."), transient);
        return;
      }
      albumTries = 0;
      const q = document.getElementById("queue");
      if (q && q.classList.contains("warn") && G.pending === 0) { q.classList.remove("warn"); q.textContent = ""; }
      albumCursor = json.continueCursor; albumDone = json.isDone;
      const grid = document.getElementById("grid"); if (!grid) return;
      const seen = new Set(albumItems.map(p => p.clientId));
      const fresh = json.page.filter(p => !seen.has(p.clientId));
      const start = albumItems.length;
      albumItems.push(...fresh);
      grid.insertAdjacentHTML("beforeend", fresh.map((p, i) => `
        <button type="button" data-i="${start + i}" aria-label="${p.kind === "video" ? "Video" : "Photo"} by ${esc(p.authorName)}">
          <img src="${esc(p.thumbUrl || p.imageUrl || "")}" alt="" loading="lazy" decoding="async">
          ${p.kind === "video" ? `<span class="play">${playIcon}</span>` : ""}
          <span class="by">${esc(p.authorName)}</span>
        </button>`).join(""));
      grid.querySelectorAll("button:not([data-wired])").forEach(b => {
        b.dataset.wired = "1";
        b.addEventListener("click", () => openLightbox(+b.dataset.i, b));
        const img = b.querySelector("img"), show = () => img.classList.add("loaded");
        img.complete && img.naturalWidth ? show() : img.addEventListener("load", show, { once: true });
      });
      paintAlbumMeta();
      if (!albumItems.length) grid.outerHTML = `<p class="empty-album">No photos on this roll yet.</p>`;
      if (more) { more.hidden = albumDone; more.textContent = "Load more"; }
    } catch (_) {
      albumHiccup("No connection. Your photos are still here — trying again…", true);
    } finally { albumLoading = false; }
  }

  function openLightbox(i, opener) {
    const prev = document.querySelector(".lightbox"); if (prev) prev.remove();
    const lb = document.createElement("div");
    lb.className = "lightbox"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true");
    lb.setAttribute("aria-label", "Photo viewer");
    document.body.appendChild(lb); setInert(true);
    const show = n => {
      i = Math.max(0, Math.min(albumItems.length - 1, n));
      const p = albumItems[i];
      const media = p.kind === "video" && p.videoUrl
        ? `<video src="${esc(p.videoUrl)}" poster="${esc(p.imageUrl || "")}" controls playsinline></video>`
        : `<img src="${esc(p.imageUrl || p.thumbUrl || "")}" alt="Photo by ${esc(p.authorName)}">`;
      lb.innerHTML = `
        <div class="lb-top"><div class="lb-who"><b>${esc(p.authorName)}</b><span>${esc(new Date(p.capturedAt).toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}))}</span></div>
          <button class="round" type="button" data-x aria-label="Close">${ICON.close}</button></div>
        <div class="lb-stage">${media}</div>
        <div class="lb-bot"><div class="lb-nav">
            <button class="round" type="button" data-prev aria-label="Previous" ${i === 0 ? "disabled" : ""}>${ICON.left}</button>
            <button class="round" type="button" data-next aria-label="Next" ${i >= albumItems.length - 1 ? "disabled" : ""}>${ICON.right}</button></div>
          <button class="btn2" type="button" data-dl>${ICON.save}Save ${p.kind === "video" ? "video" : "photo"}</button></div>`;
      lb.querySelector("[data-x]").onclick = close;
      lb.querySelector("[data-prev]").onclick = () => show(i - 1);
      lb.querySelector("[data-next]").onclick = () => { if (i >= albumItems.length - 2 && !albumDone) loadAlbum(); show(i + 1); };
      lb.querySelector("[data-dl]").onclick = () => save(p, i);
      lb.querySelector("[data-x]").focus();
    };
    const onKey = e => {
      if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") show(i - 1); else if (e.key === "ArrowRight") show(i + 1);
      else trapTab(e, lb);
    };
    let x0 = null;
    lb.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) show(i + (dx < 0 ? 1 : -1)); x0 = null; });
    function close() {
      lb.remove(); setInert(false); document.removeEventListener("keydown", onKey);
      const tile = document.querySelector(`#grid button[data-i="${i}"]`) || opener;
      if (tile && tile.focus) tile.focus();
    }
    document.addEventListener("keydown", onKey);
    show(i);
  }

  async function save(p, i) {
    const url = p.kind === "video" && p.videoUrl ? p.videoUrl : p.imageUrl;
    if (!url) return;
    const name = `filmsera-${(G.film.title || "film").replace(/[^a-z0-9]+/gi, "-").toLowerCase()}-${i + 1}.${p.kind === "video" ? "mov" : "jpg"}`;
    try {
      const r = await fetch(url, { mode: "cors", credentials: "omit" });
      if (!r.ok) throw new Error();
      const blob = await r.blob();
      const file = new File([blob], name, { type: blob.type || "image/jpeg" });
      if (isIOS && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === "AbortError") return; }
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      toast("Saved", 1800, "ok");
    } catch (_) {
      window.open(url, "_blank", "noopener"); // fall back to the full-size file in a new tab
    }
  }

  // ---------------------------------------------------------------- boot

  /**
   * Invite preview through the rate-limited `/web/lookup` action (security
   * finding M3: the page no longer calls the public films:getByInviteCode).
   * Resolves the film, or null for an unknown code; throws on network / 429.
   */
  async function lookup(name) {
    const base = DEPLOYMENTS[name].site;
    const { status, json } = await api("/web/lookup", { body: { code }, base, timeout: 15000 });
    if (status === 404 && json && json.code === "not_found") return null;
    if (!json || !json.ok) {
      const e = new Error(json && json.code || "lookup failed");
      e.kind = status === 429 ? "rate" : status === 503 ? "busy" : "offline";
      throw e;
    }
    return json.film;
  }

  // A film made by a debug build lives on dev. Without an explicit ?backend=,
  // reopen the page on that film's own deployment so browser join works for it
  // too (the same tested ?backend= path testers use). Real films stay on prod.
  function useFilmBackend(name) {
    if (explicitBackend || name === WEB || !DEPLOYMENTS[name]) return false;
    const u = new URL(location.origin + "/join.html");
    u.searchParams.set("code", code);
    u.searchParams.set("backend", name);
    location.replace(u.toString());
    return true;
  }

  async function load(skipResume) {
    if (!code) return renderLost();
    // A guest who already joined on this device resumes straight into their film.
    const s = !skipResume && session.get();
    if (s && await resume(s)) return;
    if (injected && injected.film) {
      if (useFilmBackend(injected.backend || "prod")) return;
      filmBackend = injected.backend || "prod";
      render(injected.film);
      // The Worker's copy may be a minute old and lacks hostOnly/full: refresh it.
      lookup(filmBackend).then(f => { if (f && mode === null) render(f); }).catch(() => {});
      return;
    }
    const order = explicitBackend ? [explicitBackend] : ["prod", "dev"];
    let failures = 0, kind = "offline";
    for (const name of order) {
      try { const f = await lookup(name); if (f) { if (useFilmBackend(name)) return; filmBackend = name; return render(f); } }
      catch (e) { failures++; if (e && (e.kind === "rate" || e.kind === "busy")) kind = e.kind; }
    }
    // A rate-limited or busy answer is reported as such, never as "no connection" (N2).
    renderLost(failures === 0 ? null : (kind !== "offline" || failures === order.length) ? kind : null);
  }
  load();
})();
</script>
</body>
</html>
