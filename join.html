<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You're invited · Filmsera</title>
<!-- The invite Worker (worker/) rewrites the title, description, canonical and
     og:/twitter: tags with the film's own title, host and share card, and
     injects window.__INVITE__ so the page paints without a round trip. Without
     the Worker the page still works: it looks the code up itself. -->
<link rel="canonical" href="https://getfilmsera.cam/join/" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-itunes-app" content="app-id=6781880091, app-argument=https://getfilmsera.cam/join/" id="smartBanner" />
<meta name="description" content="You've been invited to shoot a shared Film on Filmsera. Everyone's photos stay hidden until the reveal." />
<meta property="og:site_name" content="Filmsera" />
<meta property="og:type" content="website" />
<meta property="og:title" content="You're invited · Filmsera" />
<meta property="og:description" content="Join the Film, shoot your shots, and see everyone's photos at the reveal." />
<meta property="og:url" content="https://getfilmsera.cam/join/" />
<meta property="og:image" content="https://getfilmsera.cam/shots/filmsera-social.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="A Filmsera invitation" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="You're invited · Filmsera" />
<meta name="twitter:description" content="Join the Film, shoot your shots, and see everyone's photos at the reveal." />
<meta name="twitter:image" content="https://getfilmsera.cam/shots/filmsera-social.png" />
<meta name="theme-color" content="#0A0807" />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0A0807; --surface:#16120E; --surface-2:#1E1913; --brass:#E6B450; --brass-hi:#F2CB74; --brass-deep:#1A1206;
    --cream:#F4ECDD; --muted:#A89C88; --dim:#6F6556; --hair:rgba(245,232,210,.10); --hair-2:rgba(245,232,210,.16);
    --display:"Instrument Serif",Georgia,serif;
    --body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"Space Mono",ui-monospace,Menlo,monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--bg);-webkit-text-size-adjust:100%;}
  body{font-family:var(--body);color:var(--cream);min-height:100svh;background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  a{color:inherit;}

  /* Film grain over everything — the one texture the app uses too. */
  .grain{position:fixed;inset:-50%;pointer-events:none;z-index:50;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain 1.2s steps(4) infinite;}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(0,0)}}

  .mark{width:26px;height:19px;display:inline-block;flex:none;background:var(--brass);
    -webkit-mask:url(/brand/filmsera-mark.svg) center/contain no-repeat;mask:url(/brand/filmsera-mark.svg) center/contain no-repeat;}
  .wordmark{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);font-size:24px;letter-spacing:.2px;text-decoration:none;color:var(--cream);}
  .eyebrow{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;color:var(--muted);}

  /* ---------- The invitation (the same card on phone and inside the desktop mock-up) ---------- */
  .invite{position:relative;display:flex;flex-direction:column;min-height:100svh;background:var(--bg);overflow:hidden;isolation:isolate;}
  .cover{position:absolute;inset:0 0 auto 0;height:64%;z-index:-1;overflow:hidden;background:#120E0A;}
  .cover img{width:100%;height:100%;object-fit:cover;transform-origin:50% 40%;opacity:0;
    transition:opacity 1.1s var(--ease);animation:kenburns 22s ease-in-out infinite alternate;}
  .cover img.loaded{opacity:1;}
  @keyframes kenburns{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
  .cover::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,8,7,.55) 0%,rgba(10,8,7,0) 22%,rgba(10,8,7,.08) 50%,rgba(10,8,7,.82) 82%,var(--bg) 100%);}
  .cover.empty{background:radial-gradient(90% 70% at 70% 15%,rgba(230,180,80,.28),transparent 60%),radial-gradient(70% 60% at 10% 60%,rgba(190,90,50,.22),transparent 65%),#120E0A;}
  /* Light leak, slow and faint. */
  .leak{position:absolute;inset:0;z-index:-1;pointer-events:none;mix-blend-mode:screen;opacity:.55;
    background:radial-gradient(40% 30% at 100% 8%,rgba(255,140,60,.35),transparent 70%);animation:leak 9s ease-in-out infinite alternate;}
  @keyframes leak{from{opacity:.25}to{opacity:.6}}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 22px 0;}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
    background:rgba(10,8,7,.45);border:1px solid var(--hair-2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--cream);}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--brass);box-shadow:0 0 10px var(--brass);animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.35}}

  .sheet{margin-top:auto;padding:0 24px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;}
  .sheet{text-shadow:0 1px 18px rgba(0,0,0,.45);}
  .host{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:500;color:var(--cream);opacity:.92;}
  .avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700;color:var(--brass-deep);
    background:linear-gradient(135deg,var(--brass-hi),var(--brass));box-shadow:0 0 0 2px rgba(10,8,7,.6);}
  h1.title{font-family:var(--display);font-weight:400;font-size:clamp(46px,13vw,64px);line-height:.98;letter-spacing:-.6px;margin-top:10px;text-wrap:balance;}
  .meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:12px;letter-spacing:.2px;}
  .meta b{color:var(--cream);font-weight:400;}

  /* Develop countdown — mono digits in little frames, like a dial readout. */
  .develop{margin-top:20px;display:grid;gap:10px;padding:13px 14px 14px;border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid var(--hair);}
  .develop .label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;white-space:nowrap;font-family:var(--mono);font-size:10px;letter-spacing:2.2px;color:var(--muted);text-transform:uppercase;}
  .develop .label strong{color:var(--cream);font-family:var(--body);font-size:13px;letter-spacing:0;text-transform:none;font-weight:600;}
  .clock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .unit{text-align:center;padding:8px 0 6px;border-radius:11px;background:#0E0B08;border:1px solid var(--hair);}
  .unit b{display:block;font-family:var(--mono);font-size:21px;font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums;line-height:1.1;}
  .unit i{display:block;font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:1.4px;color:var(--dim);margin-top:2px;}

  .spots{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--muted);}
  .frames{display:flex;gap:4px;}
  .frames span{width:9px;height:13px;border-radius:2px;border:1px solid var(--hair-2);}
  .frames span.on{background:var(--brass);border-color:var(--brass);}

  .cta{margin-top:22px;position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px 24px;border-radius:999px;
    font-family:var(--mono);font-weight:700;font-size:15.5px;letter-spacing:.2px;color:var(--brass-deep);text-decoration:none;overflow:hidden;
    background:linear-gradient(180deg,var(--brass-hi),var(--brass));box-shadow:0 18px 40px -12px rgba(230,180,80,.55),inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .18s var(--ease),box-shadow .18s var(--ease);}
  .cta:active{transform:scale(.98);}
  .cta::after{content:"";position:absolute;inset:0;transform:translateX(-120%);
    background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);animation:sheen 4.5s ease-in-out 1.4s infinite;}
  @keyframes sheen{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
  .cta svg{width:18px;height:18px;}
  .fine{text-align:center;font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5;}

  .code{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 16px;border-radius:16px;border:1px dashed var(--hair-2);}
  .code .k{font-family:var(--mono);font-size:10px;letter-spacing:2.2px;color:var(--muted);}
  .code .v{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:5px;color:var(--cream);margin-top:1px;}
  .copy{padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--hair);font-size:13px;font-weight:600;white-space:nowrap;transition:background .2s;}
  .copy.done{color:var(--brass);}

  /* How it works — three quiet steps under the fold. */
  .how{padding:34px 24px calc(40px + env(safe-area-inset-bottom));border-top:1px solid var(--hair);}
  .how h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:8px 0 18px;}
  .how h2 em{color:var(--brass);}
  .steps{list-style:none;display:grid;gap:10px;}
  .steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--hair);}
  .steps .n{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--brass);background:rgba(230,180,80,.1);border:1px solid rgba(230,180,80,.25);}
  .steps b{display:block;font-weight:600;font-size:15px;}
  .steps p{color:var(--muted);font-size:13.5px;line-height:1.45;margin-top:2px;}
  .footer{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:28px;color:var(--dim);font-size:12px;}
  .footer a{text-decoration:none;color:var(--muted);}
  .badge img{height:44px;display:block;}

  /* Entrance choreography. */
  .rise{opacity:0;transform:translateY(14px);animation:rise .9s var(--ease) forwards;}
  @keyframes rise{to{opacity:1;transform:none}}

  /* ---------- Desktop: invitation in a phone + scan-to-join ---------- */
  .desk{display:none;}
  @media (min-width:900px){
    body{display:grid;place-items:center;padding:48px;
      background:radial-gradient(70% 60% at 30% 40%,rgba(230,180,80,.08),transparent 70%),radial-gradient(60% 60% at 90% 100%,rgba(190,90,50,.07),transparent 70%),var(--bg);}
    .stage{display:grid;grid-template-columns:auto 420px;gap:88px;align-items:center;max-width:1120px;}
    .phone{position:relative;width:372px;height:780px;border-radius:58px;padding:12px;
      background:linear-gradient(145deg,#2a241d,#0d0b09 40%,#1d1914);box-shadow:0 0 0 1px rgba(255,255,255,.07),0 60px 120px -30px rgba(0,0,0,.9),0 30px 80px -40px rgba(230,180,80,.25);}
    .phone::before{content:"";position:absolute;top:24px;left:50%;transform:translateX(-50%);width:110px;height:32px;border-radius:20px;background:#000;z-index:5;}
    .screen{width:100%;height:100%;border-radius:47px;overflow:hidden;position:relative;}
    .screen .invite{min-height:100%;height:100%;}
    .screen .topbar{padding-top:62px;}
    .screen .how{display:none;}
    .screen h1.title{font-size:50px;}
    .screen .unit b{font-size:19px;}
    .desk{display:block;}
    .desk .wordmark{margin-bottom:44px;}
    .desk h2{font-family:var(--display);font-weight:400;font-size:64px;line-height:.98;letter-spacing:-.8px;margin-top:14px;text-wrap:balance;}
    .desk .lead{color:var(--muted);font-size:17px;line-height:1.55;margin-top:16px;max-width:400px;}
    .scan{display:flex;gap:20px;align-items:center;margin-top:34px;padding:18px;border-radius:24px;background:var(--surface);border:1px solid var(--hair);}
    .qr{width:132px;height:132px;flex:none;padding:10px;border-radius:16px;background:#F4ECDD;}
    .qr svg{width:100%;height:100%;display:block;}
    .scan b{display:block;font-size:17px;font-weight:600;}
    .scan p{color:var(--muted);font-size:14px;line-height:1.5;margin-top:6px;}
    .desk .row{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap;}
    .desk .code{margin-top:0;flex:1;min-width:220px;}
  }

  /* ---------- Not found ---------- */
  .lost{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 26px;gap:0;}
  .lost .print{width:132px;height:160px;border-radius:6px;background:#F4ECDD;padding:9px 9px 30px;transform:rotate(-4deg);box-shadow:0 22px 50px rgba(0,0,0,.55);margin-bottom:34px;}
  .lost .print div{width:100%;height:100%;border-radius:2px;background:linear-gradient(160deg,#2a2017,#0d0a07);display:grid;place-items:center;}
  .lost .print .mark{width:40px;height:29px;opacity:.5;}
  .lost h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,10vw,52px);line-height:1;}
  .lost p{color:var(--muted);font-size:16px;line-height:1.5;margin-top:12px;max-width:360px;}
  .lost form{display:flex;gap:8px;margin-top:28px;width:100%;max-width:380px;}
  .lost input{flex:1;min-width:0;padding:16px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--hair-2);color:var(--cream);
    font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:4px;text-transform:uppercase;outline:none;}
  .lost input:focus{border-color:var(--brass);}
  .lost input::placeholder{color:var(--dim);letter-spacing:2px;font-weight:400;}
  .lost form .cta{margin:0;width:auto;padding:16px 22px;}
  .lost .alt{margin-top:22px;font-size:14px;color:var(--muted);}
  .lost .alt a{color:var(--brass);text-decoration:none;}
  .loading{min-height:100svh;display:grid;place-items:center;}
  .loading .mark{width:44px;height:32px;animation:pulse 1.4s ease-in-out infinite;}

  @media (prefers-reduced-motion:reduce){
    .cover img,.leak,.grain,.cta::after,.chip .dot{animation:none!important;}
    .rise{animation-duration:.01s;}
  }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div id="app"><div class="loading" role="status" aria-label="Opening your invitation"><span class="mark"></span></div></div>

<script src="/assets/qrcode.min.js" defer></script>
<script>
(function () {
  "use strict";
  // Production first; dev builds create films on the dev deployment, so a code
  // missing in production is looked up there too.
  const BACKENDS = ["https://elated-gopher-868.convex.cloud", "https://resilient-goat-339.convex.cloud"];
  const APP_STORE = "https://apps.apple.com/us/app/filmsera-group-film-camera/id6781880091";
  const SITE = "https://getfilmsera.cam";

  const app = document.getElementById("app");
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  // Accept the canonical /join/XXXX route and the older ?code= links.
  function readCode() {
    const p = new URLSearchParams(location.search);
    const m = location.pathname.match(/^\/join\/([A-Za-z0-9]{4,16})\/?$/);
    return (p.get("code") || (m && m[1]) || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 16);
  }
  const injected = window.__INVITE__ || null;
  const code = (injected && injected.code) || readCode();
  const link = `${SITE}/join/${encodeURIComponent(code)}`;
  const banner = document.getElementById("smartBanner");
  if (banner && code) banner.content = `app-id=6781880091, app-argument=${link}`;

  const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  function initials(name) {
    return String(name || "").trim().split(/\s+/).slice(0, 2).map(s => s[0] || "").join("").toUpperCase() || "★";
  }
  function developsText(ts) {
    const d = new Date(ts), now = new Date();
    const days = (d - now) / 864e5;
    const time = d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
    if (days >= 0 && days < 6) return `${d.toLocaleDateString(undefined, {weekday:"short"})} ${time}`;
    return `${d.toLocaleDateString(undefined, {month:"short", day:"numeric"})}, ${time}`;
  }

  function invitationHTML(f) {
    const revealed = f.status === "revealed" || (f.revealAt && f.revealAt <= Date.now());
    const shots = f.shotsPerPerson ? `<b>${Math.round(f.shotsPerPerson)} shots</b> each` : "";
    const when = revealed ? "Developed" : (f.revealAt ? `Develops <b>${esc(developsText(f.revealAt))}</b>` : "");
    const meta = [shots, when].filter(Boolean).join(" · ");
    const members = Math.max(1, Math.round(f.memberCount || 1));
    const cap = Math.round(f.guestCap || 0);
    const frames = cap && cap <= 24
      ? `<span class="frames" aria-hidden="true">${Array.from({length:cap}, (_, i) => `<span class="${i < members ? "on" : ""}"></span>`).join("")}</span>`
      : "";
    const spots = cap ? `${members} of ${cap} joined` : `${members} ${members === 1 ? "person" : "people"} in`;
    const develop = revealed
      ? `<div class="develop rise" style="animation-delay:.32s"><div class="label">The reveal<strong>This film has developed</strong></div></div>`
      : (f.revealAt ? `<div class="develop rise" style="animation-delay:.32s"><div class="label">Until the reveal<strong>${esc(new Date(f.revealAt).toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"}))}</strong></div>
          <div class="clock" data-countdown="${f.revealAt}">${["D","H","M","S"].map(u => `<div class="unit"><b>--</b><i>${u}</i></div>`).join("")}</div></div>` : "");
    const ctaLabel = revealed ? "See the photos" : "Join this film";
    return `
      <section class="invite" aria-label="Invitation to ${esc(f.title)}">
        <div class="cover${f.coverUrl ? "" : " empty"}">${f.coverUrl ? `<img src="${esc(f.coverUrl)}" alt="" decoding="async">` : ""}</div>
        <div class="leak" aria-hidden="true"></div>
        <div class="topbar">
          <a class="wordmark" href="/" style="font-size:20px"><span class="mark"></span>Filmsera</a>
          <span class="chip"><span class="dot"></span>Private invite</span>
        </div>
        <div class="sheet">
          <div class="host rise"><span class="avatar">${esc(initials(f.hostName))}</span>${f.hostName ? `${esc(f.hostName)} invited you` : "You're invited"}</div>
          <h1 class="title rise" style="animation-delay:.08s">${esc(f.title)}</h1>
          ${meta ? `<div class="meta rise" style="animation-delay:.16s">${meta}</div>` : ""}
          ${develop}
          <div class="spots rise" style="animation-delay:.4s">${frames}<span>${esc(spots)}</span></div>
          <a class="cta rise" style="animation-delay:.48s" href="${esc(link)}" data-join>${ctaLabel} ${arrow}</a>
          <div class="fine rise" style="animation-delay:.56s">${revealed ? "Open Filmsera to see every roll." : "Free for guests · Your photos stay hidden until the reveal."}</div>
          <div class="code rise" style="animation-delay:.62s"><div><div class="k">INVITE CODE</div><div class="v">${esc(code)}</div></div>
            <button class="copy" type="button" data-copy>Copy code</button></div>
        </div>
      </section>`;
  }

  function howHTML(f) {
    const n = f.shotsPerPerson ? Math.round(f.shotsPerPerson) : null;
    return `
      <section class="how">
        <div class="eyebrow">How a Film works</div>
        <h2>Shoot now. <em>See it all</em> at the reveal.</h2>
        <ol class="steps">
          <li><span class="n">01</span><div><b>Join with your name</b><p>Get Filmsera free and tap Join. No account fuss for guests.</p></div></li>
          <li><span class="n">02</span><div><b>${n ? `Take your ${n} shots` : "Take your shots"}</b><p>Like a disposable camera — every frame counts, and no one sees them yet.</p></div></li>
          <li><span class="n">03</span><div><b>Everyone's roll develops together</b><p>${f.revealAt ? `At ${esc(developsText(f.revealAt))}, ` : "At the reveal, "}every photo from every guest appears at once.</p></div></li>
        </ol>
        <div class="footer">
          <a class="badge" href="${APP_STORE}"><img src="/shots/app-store-badge.svg" alt="Download on the App Store" /></a>
          <span><a href="/">getfilmsera.cam</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></span>
        </div>
      </section>`;
  }

  function deskHTML(f) {
    const revealed = f.status === "revealed" || (f.revealAt && f.revealAt <= Date.now());
    return `
      <aside class="desk">
        <a class="wordmark" href="/"><span class="mark"></span>Filmsera</a>
        <div class="eyebrow">${f.hostName ? `${esc(f.hostName)} invited you to` : "You're invited to"}</div>
        <h2>${esc(f.title)}</h2>
        <p class="lead">${revealed
          ? "This Film has developed. Open it on your iPhone to see every guest's roll."
          : "A shared disposable camera for everyone there. Shoot your frames on your phone — no one sees them until the whole roll develops at once."}</p>
        <div class="scan">
          <div class="qr" id="qr" aria-label="QR code to open this invitation on your phone"></div>
          <div><b>Scan to join on your iPhone</b><p>Point your iPhone camera here. The invitation opens right in Filmsera.</p></div>
        </div>
        <div class="row">
          <a class="badge" href="${APP_STORE}"><img src="/shots/app-store-badge.svg" alt="Download on the App Store" style="height:48px" /></a>
          <div class="code"><div><div class="k">INVITE CODE</div><div class="v">${esc(code)}</div></div>
            <button class="copy" type="button" data-copy>Copy</button></div>
        </div>
      </aside>`;
  }

  function wire() {
    app.querySelectorAll(".cover img").forEach(img => {
      const show = () => img.classList.add("loaded");
      img.complete && img.naturalWidth ? show() : img.addEventListener("load", show, {once:true});
    });
    app.querySelectorAll("[data-copy]").forEach(btn => btn.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(code); } catch (_) {}
      const label = btn.textContent;
      btn.textContent = "Copied ✓"; btn.classList.add("done");
      setTimeout(() => { btn.textContent = label; btn.classList.remove("done"); }, 1800);
    }));
    // The app may not be installed. Try the app first; if the page is still
    // showing a moment later, go to the App Store. The code is copied either
    // way so it can be pasted into Films › Join after installing.
    app.querySelectorAll("[data-join]").forEach(a => a.addEventListener("click", e => {
      e.preventDefault();
      try { navigator.clipboard && navigator.clipboard.writeText(code); } catch (_) {}
      if (!isIOS) { location.href = APP_STORE; return; }
      const fallback = setTimeout(() => { location.href = APP_STORE; }, 1500);
      const cancel = () => clearTimeout(fallback);
      window.addEventListener("pagehide", cancel, {once:true});
      document.addEventListener("visibilitychange", () => { if (document.hidden) cancel(); }, {once:true});
      location.href = `filmcamera://join/${encodeURIComponent(code)}`;
    }));
    const clocks = app.querySelectorAll("[data-countdown]");
    if (clocks.length) {
      const tick = () => clocks.forEach(c => {
        let s = Math.max(0, Math.floor((+c.dataset.countdown - Date.now()) / 1000));
        const parts = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
        c.querySelectorAll("b").forEach((b, i) => { const v = String(parts[i]).padStart(2, "0"); if (b.textContent !== v) b.textContent = v; });
      });
      tick(); setInterval(tick, 1000);
    }
    const qrBox = document.getElementById("qr");
    if (qrBox) {
      const draw = () => {
        if (!window.qrcode) return false;
        const q = window.qrcode(0, "M"); q.addData(link); q.make();
        const n = q.getModuleCount(); let d = "";
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
        qrBox.innerHTML = `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}" fill="#0A0807"/></svg>`;
        return true;
      };
      if (!draw()) window.addEventListener("load", draw, {once:true});
    }
  }

  function render(f) {
    if (!f) return renderLost();
    document.title = `${f.title} · You're invited · Filmsera`;
    // Phones get the invitation full-bleed plus "how it works"; desktops the mock-up.
    const mq = window.matchMedia("(min-width:900px)");
    const layout = () => {
      if (mq.matches) { app.innerHTML = `<main class="stage"><div class="phone"><div class="screen">${invitationHTML(f)}</div></div>${deskHTML(f)}</main>`; }
      else { app.innerHTML = `<main>${invitationHTML(f)}${howHTML(f)}</main>`; }
      wire();
    };
    layout();
    mq.addEventListener ? mq.addEventListener("change", layout) : mq.addListener(layout);
  }

  function renderLost(offline) {
    document.title = "Invitation not found · Filmsera";
    app.innerHTML = `
      <main class="lost">
        <div class="print rise" aria-hidden="true"><div><span class="mark"></span></div></div>
        <h1 class="rise" style="animation-delay:.08s">${offline ? "We couldn't open<br>your invitation" : "This invitation<br>didn't develop"}</h1>
        <p class="rise" style="animation-delay:.16s">${offline
          ? "Check your connection and try again."
          : (code ? `The code <b style="color:var(--cream);font-family:var(--mono)">${esc(code)}</b> doesn't match a Film. It may have a typo, or the Film has ended.` : "Enter the invite code your host shared with you.")}</p>
        <form class="rise" style="animation-delay:.24s" id="codeForm" autocomplete="off">
          <input name="code" maxlength="16" placeholder="INVITE CODE" aria-label="Invite code" autocapitalize="characters" spellcheck="false" value="" />
          <button class="cta" type="submit">Open ${arrow}</button>
        </form>
        <div class="alt rise" style="animation-delay:.32s">New to Filmsera? <a href="${APP_STORE}">Get the app — it's free →</a></div>
      </main>`;
    document.getElementById("codeForm").addEventListener("submit", e => {
      e.preventDefault();
      const v = e.target.code.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (v) location.href = `/join/${v}`;
    });
  }

  async function lookup(base) {
    const r = await fetch(`${base}/api/query`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({path: "films:getByInviteCode", args: {inviteCode: code}, format: "json"})
    });
    const j = await r.json();
    return j && j.status === "success" ? j.value : null;
  }

  async function load() {
    if (injected) return render(injected.film);
    if (!code) return renderLost();
    let failures = 0;
    for (const base of BACKENDS) {
      try { const f = await lookup(base); if (f) return render(f); }
      catch (_) { failures++; }
    }
    renderLost(failures === BACKENDS.length);
  }
  load();
})();
</script>
</body>
</html>
